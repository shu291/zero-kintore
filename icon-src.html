<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
.ic{width:512px;height:512px;position:relative;overflow:hidden;background:linear-gradient(145deg,#ff8a3d,#ff5470)}
.ic.rounded{border-radius:112px}
.ic svg{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>

    <line x1="104" y1="52" x2="72" y2="66"/><line x1="72" y1="66" x2="48" y2="80"/><line x1="48" y1="80" x2="22" y2="92"/>
    <line x1="104" y1="52" x2="108" y2="72"/><line x1="108" y1="72" x2="106" y2="92"/>
  </g>
  <circle cx="113" cy="47" r="10" fill="#fff"/>
  <line x1="6" y1="92" x2="154" y2="92" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</svg>
</div>
<div class="ic" id="b" style="margin-top:20px">

    <line x1="104" y1="52" x2="108" y2="72"/><line x1="108" y1="72" x2="106" y2="92"/>
  </g>
  <circle cx="113" cy="47" r="10" fill="#fff"/>
  <line x1="6" y1="92" x2="154" y2="92" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</svg>
</div>
</body></html>
