<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>ゼロから筋トレ — 初心者のための自重トレーニング</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゼロ筋トレ">
<style>
:root{
  --bg:#0f1117; --bg2:#161a24; --card:#1b2030; --card2:#232a3d;
  --fg:#f2f4fa; --dim:#aab3cf; --dim2:#7c86a8;
  --acc:#ff8a3d; --acc2:#ff5470; --ok:#38d996; --warn:#ffc857; --bad:#ff6b6b; --info:#5ec8ff;
  --line:#2b3450; --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --c-push:#ff8a3d; --c-vpush:#ffb347; --c-pull:#5ec8ff; --c-squat:#38d996; --c-lunge:#7ee081; --c-hinge:#c084fc; --c-core:#ffd166;
}
html[data-theme="light"]{
  --bg:#f5f6fb; --bg2:#eceff8; --card:#ffffff; --card2:#f1f3fb;
  --fg:#151a2e; --dim:#4f5b83; --dim2:#7b86ab;
  --acc:#f2691b; --acc2:#e63f5f; --ok:#0f9b62; --warn:#b07a00; --bad:#d33b3b; --info:#0b84c8;
  --line:#dde2f2;
  --c-push:#f2691b; --c-vpush:#d9931a; --c-pull:#0b84c8; --c-squat:#0f9b62; --c-lunge:#3a9d4a; --c-hinge:#8a4fd3; --c-core:#b8860b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:16px; line-height:1.65; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.35;margin:0}
a{color:var(--acc)}
svg{display:block}

/* ---------- layout ---------- */
#app{max-width:640px;margin:0 auto;padding:var(--safe-t) 14px calc(94px + var(--safe-b))}
header.top{
  position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);
  padding:14px 0 10px;display:flex;align-items:center;gap:10px;
}
.brand{font-weight:900;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 45%,transparent)}
.top .sp{flex:1}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;line-height:1.2}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;position:relative}
.card.tight{padding:13px}
.card h2{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-size:12px;color:var(--dim2);font-weight:600;margin-left:auto}
.muted{color:var(--dim);font-size:13.5px}
.tiny{font-size:12px;color:var(--dim2);line-height:1.6}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.sep{height:1px;background:var(--line);margin:12px 0}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}

.btn{
  display:block;width:100%;text-align:center;border:none;border-radius:14px;
  padding:16px;font-weight:900;font-size:16px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 30%,transparent);
}
.btn.sub{background:var(--card2);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:700;padding:12px;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,var(--ok),#1fb0c8)}
.btn.sm{padding:11px;font-size:14px;border-radius:12px}
.btn.xs{padding:8px 12px;font-size:13px;border-radius:10px;width:auto;display:inline-block}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card2);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.acc{color:var(--acc);border-color:var(--acc)}
.pill.info{color:var(--info);border-color:var(--info)}
.pill.pat{color:#fff;border-color:transparent;background:var(--pc,var(--acc))}
html[data-theme="light"] .pill.pat{color:#fff}

.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}

label.f{display:block;margin:12px 0 5px;font-size:13.5px;font-weight:700;color:var(--dim)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px
}
textarea{min-height:70px;resize:vertical}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{
  flex:1;min-width:80px;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;
  padding:11px 8px;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--fg)
}
.choice button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.choice.col button{flex:1 1 100%;text-align:left;padding:12px 14px}
.choice button small{display:block;font-weight:600;color:var(--dim2);font-size:12px}
.check{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg2);margin:6px 0;font-weight:700;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.check small{display:block;font-weight:500;color:var(--dim2);font-size:12px}

/* ---------- nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{
  background:none;border:none;padding:9px 0 8px;color:var(--dim2);
  font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px
}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--acc)}
.view{display:none}.view.on{display:block}

/* ---------- home ---------- */
.hero{background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 22%,var(--card)),var(--card) 60%);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.hero.rest{background:linear-gradient(145deg,color-mix(in srgb,var(--info) 18%,var(--card)),var(--card) 60%);border-color:color-mix(in srgb,var(--info) 40%,var(--line))}
.hero.done{background:linear-gradient(145deg,color-mix(in srgb,var(--ok) 18%,var(--card)),var(--card) 60%);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.hero .kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.hero h1{font-size:24px;font-weight:900;margin:2px 0 4px}
.weekdots{display:flex;gap:6px;align-items:center}
.weekdots .d{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--dim2);background:var(--bg2)}
.weekdots .d.on{background:var(--ok);border-color:var(--ok);color:#06301c}
.weekdots .d.today{border-color:var(--acc);color:var(--acc)}
.weekdots .d.today.on{color:#06301c}
.menu{list-style:none;margin:10px 0 0;padding:0}
.menu li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.menu li:first-child{border-top:none}
.menu .fig{width:56px;height:36px;flex:none;background:var(--bg2);border-radius:10px;overflow:hidden}
.menu .nm{font-weight:800;font-size:14.5px}
.menu .dt{font-size:12px;color:var(--dim2)}
.menu .sr{margin-left:auto;font-weight:800;font-size:13px;white-space:nowrap;color:var(--dim)}
.timesel{display:flex;gap:6px;margin:8px 0}
.timesel button{flex:1;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;font-weight:800;font-size:13.5px;color:var(--fg)}
.timesel button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.timesel button small{display:block;font-weight:600;font-size:11px;color:var(--dim2)}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lvgrid .lv{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer}
.lvgrid .lv b{display:block;font-size:11.5px;color:var(--dim)}
.lvgrid .lv span{font-size:20px;font-weight:900;color:var(--pc)}
.lvgrid .lv small{display:block;font-size:10px;color:var(--dim2);line-height:1.3;word-break:break-all}
.reasons{margin:6px 0 0;padding-left:0;list-style:none}
.reasons li{font-size:13px;color:var(--dim);padding:3px 0 3px 18px;position:relative}
.reasons li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.tipbox{border-left:3px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:0 12px 12px 0;font-size:13.5px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:22px;font-weight:900;color:var(--acc)}
.stat3 small{font-size:11.5px;color:var(--dim2)}

/* ---------- figure ---------- */
.fig svg{width:100%;height:100%}
.fig .body{stroke:var(--fg);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .body2{stroke:var(--dim2);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.fig .head{fill:var(--fg)}
.fig .prop{fill:color-mix(in srgb,var(--dim2) 35%,transparent);stroke:var(--dim2);stroke-width:1.5}
.fig .ground{stroke:var(--line);stroke-width:2}
.fig .hi{stroke:var(--acc)}
.fig .propline{stroke:var(--dim2);stroke-width:3;stroke-linecap:round;fill:none}
.fig .eye{fill:var(--bg2)}
.fig .nose{stroke:var(--fg);stroke-width:3.2;stroke-linecap:round}
.fig .band{stroke:var(--acc);stroke-width:2;stroke-linecap:round;fill:none}
.fig .gear{fill:var(--acc);stroke:none}
.mbrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.mbrow .check{flex:0 0 118px;margin:0;padding:9px 10px;font-size:13px}
.mbrow select{flex:1;padding:10px;font-size:14px}
.mbrow.off select{opacity:.4}
.phasebar{display:flex;gap:3px;flex:1;max-width:160px}
.phasebar i{flex:1;height:6px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.phasebar i.on{background:var(--acc);border-color:transparent}
.phasebar i.dl.on{background:var(--info)}
.recov .rc span{font-weight:800;color:var(--fg)}
.recov .rc.rec{opacity:.55}
.recov .rc.ok span{color:var(--ok)}
.recov .rc.old span{color:var(--warn)}
.recov .rc.pain{border-color:var(--bad)}
.recov .rc.pain span{color:var(--bad)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badges .bd{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;opacity:.4}
.badges .bd.on{opacity:1;border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--bg2))}
.badges .bd span{font-size:24px;display:block;line-height:1.2}
.badges .bd b{font-size:12px;display:block}
.badges .bd small{font-size:10px;color:var(--dim2);display:block;line-height:1.3}
.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.foods .food{background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--fg);line-height:1.3}
.foods .food small{display:block;color:var(--dim2);font-weight:600;font-size:11px}
.foods .food:active{border-color:var(--acc)}
.mirror{width:100%;max-width:360px;margin:8px auto 0;aspect-ratio:16/10;object-fit:cover;border-radius:16px;transform:scaleX(-1);background:#000;display:block;border:1px solid var(--line)}
.quiz .choice.col button{padding:9px 12px;font-size:13.5px}
.quiz .choice button[data-ok="1"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.quiz .choice button[data-ok="0"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.avatarbox{display:flex;gap:12px;align-items:center;padding:4px 0 10px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.avatarbox svg{flex:none}
.aiout{white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-top:8px}
.daysel{display:flex;gap:5px}
.daysel button{flex:1;background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:8px 0;font-weight:800;font-size:13px;color:var(--fg)}
.daysel button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.checks button{background:var(--bg2);border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--dim)}
.checks button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.figbig{width:100%;max-width:360px;margin:0 auto;aspect-ratio:16/10;background:var(--bg2);border-radius:16px;border:1px solid var(--line);overflow:hidden}

/* ---------- exec overlay ---------- */
#exec{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#exec.on{display:flex}
#exec .ehead{padding:calc(10px + var(--safe-t)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#exec .ehead .prog{flex:1}
#exec .ehead .prog .bar{height:6px}
#exec .ehead .lbl{font-size:12px;color:var(--dim2);font-weight:700}
#exec .ebody{flex:1;overflow:auto;padding:14px;max-width:640px;width:100%;margin:0 auto}
#exec .efoot{padding:10px 14px calc(14px + var(--safe-b));max-width:640px;width:100%;margin:0 auto}
.stagename{font-size:12px;font-weight:800;color:var(--dim2);letter-spacing:.08em}
.exname{font-size:24px;font-weight:900;margin:2px 0 6px}
.exname small{font-size:13px;color:var(--dim);font-weight:700;margin-left:6px}
.bigtimer{position:relative;width:220px;height:220px;margin:12px auto}
.bigtimer svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigtimer circle{fill:none;stroke-width:12;stroke-linecap:round}
.bigtimer .track{stroke:var(--card2)}
.bigtimer .ring{stroke:var(--acc);transition:stroke-dashoffset .2s linear}
.bigtimer .ring.rest{stroke:var(--info)}
.bigtimer .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.bigtimer .num b{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bigtimer .num small{font-size:13px;color:var(--dim);font-weight:700;margin-top:4px}
.setdots{display:flex;gap:8px;justify-content:center;margin:8px 0}
.setdots i{width:12px;height:12px;border-radius:50%;background:var(--card2);border:1.5px solid var(--line)}
.setdots i.done{background:var(--ok);border-color:var(--ok)}
.setdots i.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 40%,transparent)}
.target{text-align:center;margin:8px 0}
.target b{font-size:44px;font-weight:900;line-height:1.1}
.target small{display:block;color:var(--dim);font-weight:700;font-size:13px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.stepper button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--card2);font-size:26px;font-weight:900;color:var(--fg)}
.stepper b{font-size:44px;font-weight:900;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.stepper small{display:block;text-align:center;color:var(--dim2);font-size:12px}
.cues{margin:8px 0 0;padding:0;list-style:none}
.cues li{padding:5px 0 5px 24px;position:relative;font-size:14px;line-height:1.55}
.cues li::before{content:attr(data-n);position:absolute;left:0;top:6px;width:18px;height:18px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:11px;font-weight:800;display:grid;place-items:center;color:var(--dim)}
.cues.miss li::before{content:"×";color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.fbrow{display:flex;gap:8px;margin:10px 0}
.fbrow button{flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:14px 6px;font-weight:800;font-size:14px;color:var(--fg)}
.fbrow button small{display:block;font-weight:600;font-size:11.5px;color:var(--dim2)}
.fbrow button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.nextbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.nextbox .fig{width:72px;height:46px;flex:none;background:var(--bg2);border-radius:10px}
.nextbox b{font-size:15px}
.nextbox small{display:block;color:var(--dim);font-size:12.5px}
.summ{text-align:center;padding:10px 0}
.summ .big{font-size:52px;line-height:1}
.summ h2{font-size:22px;font-weight:900;margin:8px 0 4px;justify-content:center}
.levelup{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 25%,var(--card)),var(--card));border:1px solid var(--ok);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:800}
.levelup small{display:block;font-weight:600;color:var(--dim);font-size:12.5px}
.sidebadge{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:900;font-size:14px}

/* ---------- records ---------- */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.heat .c.l1{background:color-mix(in srgb,var(--ok) 45%,var(--card2));border-color:transparent}
.heat .c.l2{background:color-mix(in srgb,var(--ok) 75%,var(--card2));border-color:transparent}
.heat .c.l3{background:var(--ok);border-color:transparent}
.heat .c.today{outline:1.5px solid var(--acc)}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px dashed var(--line);padding:10px 0}
.hist li:first-child{border-top:none}
.hist .hd{display:flex;align-items:center;gap:8px;cursor:pointer}
.hist .hd b{font-size:14.5px}
.hist .hd .r{margin-left:auto;font-size:12px;color:var(--dim2);white-space:nowrap}
.hist .dt{display:none;margin-top:8px;font-size:13px;color:var(--dim)}
.hist li.open .dt{display:block}
.hist table{width:100%;border-collapse:collapse;font-size:13px}
.hist td{padding:4px 0;border-top:1px solid var(--line)}
.hist td:last-child{text-align:right;white-space:nowrap}
.chart{width:100%;height:auto}
.chart text{fill:var(--dim2);font-size:10px;font-weight:700}
.chart .axis{stroke:var(--line)}
.chart .barr{fill:var(--acc)}
.chart .barr.under{fill:var(--card2);stroke:var(--line)}
.chart .goal{stroke:var(--ok);stroke-dasharray:4 4}
.chart .ln{fill:none;stroke:var(--info);stroke-width:2.5;stroke-linejoin:round}
.chart .pt{fill:var(--info)}
.ladder{display:flex;flex-direction:column;gap:6px}
.ladder .st{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.ladder .st.cur{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.ladder .st.done{opacity:.7}
.ladder .st.na{opacity:.45}
.ladder .num{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.ladder .st.cur .num{background:var(--pc);color:#fff;border-color:transparent}
.ladder .st.done .num{background:var(--ok);color:#06301c;border-color:transparent}
.ladder .nm{font-weight:800;font-size:14px}
.ladder .meta{font-size:11.5px;color:var(--dim2)}
.ladder .rt{margin-left:auto;font-size:12px;color:var(--dim2);white-space:nowrap}

/* ---------- library / knowledge ---------- */
.subtabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:14px;margin:4px 0 10px}
.subtabs button{flex:1;border:none;background:transparent;border-radius:11px;padding:9px;font-weight:800;font-size:14px;color:var(--dim)}
.subtabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.patfilter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.patfilter::-webkit-scrollbar{display:none}
.patfilter button{flex:none;border:1.5px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:var(--dim)}
.patfilter button[aria-pressed="true"]{border-color:var(--pc,var(--acc));color:var(--pc,var(--acc))}
.acc{border-top:1px solid var(--line)}
.acc:first-of-type{border-top:none}
.acc summary{padding:12px 4px;font-weight:800;font-size:15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";margin-left:auto;color:var(--dim2);font-weight:900}
.acc[open] summary::after{content:"－"}
.acc .bd{padding:0 4px 14px;font-size:14px;color:var(--dim);line-height:1.75}
.acc .bd p{margin:0 0 8px}
.acc .bd b{color:var(--fg)}
.acc .bd ul{margin:4px 0 8px;padding-left:20px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + var(--safe-b));border:1px solid var(--line)}
#modal .box h3{font-size:18px;font-weight:900;margin-bottom:8px}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- onboarding ---------- */
#onb{position:fixed;inset:0;z-index:65;background:var(--bg);display:none;flex-direction:column}
#onb.on{display:flex}
#onb .obody{flex:1;overflow:auto;padding:calc(20px + var(--safe-t)) 18px 10px;max-width:560px;width:100%;margin:0 auto}
#onb .ofoot{padding:10px 18px calc(16px + var(--safe-b));max-width:560px;width:100%;margin:0 auto}
#onb h1{font-size:26px;font-weight:900;margin:6px 0 4px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--card2)}
.steps i.on{background:var(--acc)}
.welcome{font-size:60px;text-align:center;margin:14px 0 6px}
.feature{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.feature:first-child{border-top:none}
.feature .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:none}
.feature b{font-size:15px}
.feature small{display:block;color:var(--dim);font-size:13px}

@media (min-width:700px){
  .lvgrid{grid-template-columns:repeat(7,1fr)}
}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease-out}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1s infinite}
</style>
</head>

const KNOWLEDGE = [
{id:'k1',emoji:'🔁',title:'筋トレはなぜ効く？（超回復のしくみ）',body:`
<p>筋トレをすると、筋肉の繊維に<b>ごく小さなダメージ</b>が入ります。体はそれを修復するときに「次はもっと耐えられるように」と<b>少しだけ強く作り直します</b>。これが超回復です。</p>
<p>修復には<b>だいたい48〜72時間</b>かかります。つまり<b>休んでいる時間に筋肉は育つ</b>。毎日同じ部位をやると修復が追いつかず、逆に伸びません。</p>
<p>このアプリが「昨日やったら今日は休み」をすすめるのはこのためです。</p>`},
{id:'k2',emoji:'📅',title:'週に何回やればいい？',body:`
<p>初心者は<b>週2〜3回の全身トレーニング</b>がいちばん効率がいい、というのが研究でも一貫した結論です。1回20分で十分。</p>
<p>ポイントは「毎日やる」より「<b>やめずに続ける</b>」こと。週2回を3か月続けた人は、週6回を2週間でやめた人より確実に強くなります。</p>
<ul><li>同じ部位は<b>中1日以上</b>あける</li><li>3日連続はやらない</li><li>1週間あいても気にせず再開（アプリが軽めのメニューにします）</li></ul>`},
{id:'k3',emoji:'📈',title:'回数とセットの決め方（漸進性過負荷）',body:`
<p>筋肉が強くなる唯一のルールは「<b>前より少しだけ多くやる</b>」です。これを<b>漸進性過負荷</b>と呼びます。難しい言葉ですが、やることは単純：</p>
<ul><li>前回10回できたら、今日は11回をねらう</li><li>回数の上限（たとえば15回）まで届いたら、<b>次の段（もっと難しい種目）</b>へ上がる</li></ul>
<p>1セットは「<b>あと2回くらいはできるかな</b>」というところで止めるのが目安。毎回限界までやる必要はありません。むしろ限界までやるとフォームが崩れて、ケガのもとになります。</p>
<p>このアプリは前回の記録から自動で「今日の目標回数」を決め、上限に届いたらレベルアップを提案します。</p>`},
{id:'k4',emoji:'🎯',title:'回数よりフォームが大事な理由',body:`
<p>フォームが崩れた10回より、正しい6回のほうが筋肉は育ちます。理由は2つ。</p>
<ul><li>崩れると<b>ねらった筋肉から負荷が逃げる</b>（腕立てで腰が反ると、胸ではなく腰に負担がかかる）</li><li>関節に変な力がかかって<b>ケガをする</b></li></ul>
<p>意識するのは3つだけ：<b>反動を使わない／動く幅（可動域）を大きく／下ろすときは2〜3秒かけてゆっくり</b>。</p>
<p>とくに「ゆっくり下ろす」は効きます。下ろす動きは筋肉が伸びながら力を出す（エキセントリック収縮）ので、成長への刺激が大きいことがわかっています。</p>`},
{id:'k5',emoji:'🌬️',title:'呼吸のコツ',body:`
<p>基本は「<b>力を入れるときに吐く、戻すときに吸う</b>」。腕立てなら押し上げるときに吐き、下ろすときに吸います。</p>
<p>いちばんやってはいけないのは<b>息を止めること</b>。血圧が急に上がってふらつきます。プランクのようなキープ系でも、ずっと呼吸を続けてください。</p>`},
{id:'k6',emoji:'😣',title:'筋肉痛との付き合い方',body:`
<p>始めたばかりのころは、やった翌日〜翌々日に筋肉痛が来ます。これは<b>正常</b>で、体が慣れると自然に軽くなります。</p>
<p>よくある誤解：「筋肉痛がない＝効いてない」は<b>間違い</b>です。慣れてくると筋肉痛はほとんど出なくなりますが、ちゃんと強くなっています。</p>
<ul><li>筋肉痛がある部位は<b>その日は休ませる</b>（軽く動かすと早く回復します）</li><li>2〜3日で消えるなら問題なし</li><li><b>関節の鋭い痛み</b>は筋肉痛ではありません → 下の「痛みが出たとき」を読んでください</li></ul>`},
{id:'k7',emoji:'🍚',title:'食事とたんぱく質（プロテインは必須？）',body:`
<p>筋肉の材料はたんぱく質です。目安は<b>体重1kgあたり1.2〜1.6g／日</b>。体重60kgなら約70〜100g。</p>
<p>これは普通の食事でとれる量です。たとえば：卵1個 6g／納豆1パック 8g／牛乳1杯 7g／鶏むね肉100g 22g／ごはん1杯 4g／さば缶1缶 25g。<b>毎食に「肉・魚・卵・大豆・乳製品」のどれかを入れる</b>、これだけ意識すれば十分。</p>
<p><b>プロテイン（粉）は必須ではありません。</b>食事で足りないときの補助にすぎず、飲んだからといって筋肉がつくわけではないです。サプリを買う前に、まず<b>睡眠と食事</b>。そちらのほうがはるかに効果が大きいです。</p>
<p>あと、筋トレ中は<b>水分</b>もこまめに。</p>`},
{id:'k8',emoji:'😴',title:'睡眠と成長',body:`
<p>筋肉が修復されるのは主に<b>寝ている間</b>。成長ホルモンは深い睡眠中に多く出ます。目安は<b>7〜9時間</b>。</p>
<p>睡眠不足のときは筋トレの効果が落ちるだけでなく、ケガも増えます。徹夜明けなら筋トレより寝るほうが筋肉のためになります。</p>`},
{id:'k9',emoji:'🧒',title:'高校生・成長期の注意',body:`
<p>「成長期に筋トレをすると背が伸びなくなる」は<b>俗説</b>で、科学的な根拠はありません。むしろ正しく行えば骨や関節が丈夫になります。</p>
<p>ただし気をつけることはあります：</p>
<ul><li><b>自重（自分の体重）中心でOK</b>。このアプリの種目はすべて自重です</li><li>重いバーベルで「限界の1回」に挑戦するのは避ける</li><li>痛みがあるのに我慢して続けない</li><li>成長期は睡眠と食事の影響がとくに大きい</li></ul>`},
{id:'k10',emoji:'🧱',title:'回数が伸びなくなったら（停滞）',body:`
<p>誰でも必ず来ます。原因の多くは「トレーニング」ではなく「<b>回復</b>」側にあります。まず確認：</p>
<ul><li>睡眠は足りてる？</li><li>ちゃんと食べてる？（とくにたんぱく質）</li><li>休みの日をとってる？</li></ul>
<p>それでも伸びないときの手：</p>
<ul><li><b>1週間だけ軽め</b>にする（ディロード）。回復してから戻るとスッと伸びることが多い</li><li>あえて<b>一段やさしい種目</b>に戻って、フォームを丁寧に、ゆっくり下ろす</li><li>テンポを変える（下で3秒止めるなど）</li></ul>
<p>このアプリでは、「きつすぎ」が2回続くと自動で一段やさしくします。恥ずかしいことではなく、伸ばすための作戦です。</p>`},
{id:'k11',emoji:'🪞',title:'見た目が変わるまでどれくらい？',body:`
<p>最初の2〜4週間で回数が急に伸びます。これは筋肉が増えたのではなく、<b>神経が筋肉をうまく使えるようになった</b>から（神経の適応）。</p>
<p>見た目が変わり始めるのは<b>8〜12週間</b>くらいから。ここまで続けられれば、あとは勝手に変わっていきます。</p>
<p>体重は筋肉が増えると<b>むしろ増える</b>ことがあるので、体重だけで判断しないこと。「回数が増えた」「レベルが上がった」「同じ服のきつさが変わった」で見てください。</p>`},
{id:'k12',emoji:'🚨',title:'痛みが出たときの判断',body:`
<p>「筋肉痛」と「ケガ」は違います。見分け方：</p>
<ul><li><b>筋肉痛</b>：にぶい痛み／筋肉の広い範囲／翌日〜翌々日に出て2〜3日で消える／動かすと少しラク</li><li><b>ケガ</b>：鋭い痛み／関節（ひざ・肩・手首・腰）／トレーニング中や直後に出た／動かすと悪化</li></ul>
<p><b>ケガのサインなら、その日は中止。</b>数日たっても痛い、腫れている、しびれるなら病院へ。がまんして続けると、数週間の休みになります。</p>
<p>手首が痛いときはこぶしを握った腕立て（ナックルプッシュアップ）や、手のひらの下にタオルを敷くだけで楽になることが多いです。</p>`},
{id:'k13',emoji:'🔄',title:'期分けとコンディション（このアプリの自動調整）',body:`
<p>強くなるには「負荷を上げる」と「回復する」の両方が要ります。このアプリは4週で1サイクル：<b>導入 → 積み上げ → 強化 → 回復（ディロード）</b>。回復週はセットを1つ減らし回数を7割にして、たまった疲れを抜きます。抜いたあとの週に回数がスッと伸びるのが典型パターンです。</p>
<p>開始前の<b>コンディションチェック</b>（睡眠・筋肉痛・気分）が低い日は自動で軽めにします。「今日はサボり」ではなく「計画どおりの調整」。無理をした1回より、続けられる10回のほうが強くなります。</p>
<p><b>回復マップ</b>は部位ごとの「最後にやった日」。48時間あいていない部位は回復中なので、あいている部位の多い型を自動で選びます。3回続けて回数が伸びない種目は<b>停滞</b>として知らせ、対策（テンポを変える／一段やさしく／回復週）を出します。</p>`},
{id:'k14',emoji:'🔥',title:'ダイエットの基本（食べないダイエットが失敗する理由）',body:`
<p>体脂肪1kgは約<b>7,200kcal</b>。1日に300kcal減らすと、1か月で1kgちょっと減る計算です。地味ですが、これが「リバウンドしない速さ」。安全なペースは<b>週0.3〜0.5kg</b>。</p>
<p>いっきに減らすと何が起きるか：食べる量を極端に減らすと、体は脂肪より先に<b>筋肉を減らします</b>。筋肉が減ると基礎代謝（何もしなくても使うカロリー）が落ちて、同じ量を食べても太りやすい体に。これがリバウンドの正体です。</p>
<p>だからこのアプリは「筋トレを続けながら、食事を少しだけ整える」方式。食事の目安カロリーも、基礎代謝を下回らないように計算しています。</p>`},
{id:'k15',emoji:'🥩',title:'筋トレ×ダイエット（筋肉を残して脂肪だけ落とす）',body:`
<p>ダイエット中の筋トレの役目は「筋肉を守ること」。守るための3つ：</p>
<ul><li><b>たんぱく質を増やす</b>：体重1kgあたり1.6g（60kgなら約100g）。減量中は少し多めが目安</li><li><b>筋トレの日は炭水化物を抜かない</b>：力が出ないとトレの質が落ち、筋肉が減る</li><li><b>有酸素は休息日に</b>：歩く・軽いサーキット。筋トレの直前に長い有酸素をしない</li></ul>
<p>体重は「筋肉が増えて脂肪が減る」と<b>あまり変わらない</b>ことがあります。それは大成功。7日平均の体重に加えて、見た目・服のきつさ・回数の伸びで判断してください。</p>`},
{id:'k16',emoji:'🧒',title:'高校生・成長期のダイエットで守ること',body:`
<p>成長期は骨・筋肉・脳が育っている最中。<b>極端な食事制限はしないでください。</b>このアプリは成長期（18歳未満）の目安カロリーを控えめの減らし方（1日250kcal）にし、目標体重はBMI 18.5未満を受けつけません。</p>
<p>やること：甘い飲み物をやめる／夜食をやめる／野菜とたんぱく質を毎食／よく寝る／歩く。これだけで多くの人は自然に落ちます。</p>
<p><b>危険サイン</b>：めまい・立ちくらみ、集中できない、いつも寒い、生理が止まる・乱れる、食べることが怖くなる。ひとつでもあれば中止して、家族・保健室・お医者さんに相談を。体重より健康のほうがずっと大事です。</p>`},
{id:'k17',emoji:'📉',title:'体重の波と停滞期',body:`
<p>体重は1日で<b>±1〜2kg</b>ふつうに動きます。水分・食事の重さ・塩分・便・生理周期のせいで、脂肪が1日で1kg増えることはまずありません（7,200kcal余分に食べる必要があります）。</p>
<p>だから毎日の値に一喜一憂せず、<b>7日平均</b>で見る。アプリは自動で平均と先週比を出します。測るなら毎朝トイレのあと、同じ条件で。</p>
<p><b>停滞期</b>は誰にでも来て、2〜4週続くことがあります。体が「省エネモード」に慣れた状態。対策は、（1）食事チェックを見直す、（2）睡眠を増やす、（3）1週間だけ食事を目安の上限まで戻す「ダイエットブレイク」。減らし続けるより、いったん戻したほうが再び落ち始めることが多いです。</p>`},
{id:'k18',emoji:'🥤',title:'太りにくい5つの習慣（食事チェックの中身）',body:`
<ul><li><b>甘い飲み物をやめる</b>：500mlのジュースは角砂糖10個ぶん。これだけで1日200kcal減。水・お茶・炭酸水に</li><li><b>夜食をやめる</b>：夜9時以降に食べると、脂肪になりやすく睡眠の質も落ちる。どうしてもなら、ゆで卵かヨーグルト</li><li><b>毎食たんぱく質</b>：満腹感が続き、間食が減る</li><li><b>野菜を先に</b>：食べる順番を野菜→肉魚→ごはんにするだけで血糖の上がり方がゆるやかに</li><li><b>腹八分目とよく噛む</b>：満腹を感じるまで20分かかる。早食いは食べすぎのもと</li></ul>
<p>そして<b>睡眠</b>。寝不足だと食欲ホルモンが増えて、翌日300kcal多く食べてしまうという研究があります。寝るのもダイエット。</p>`},
];

  return ladder(pat)[0];
}
function nextAvail(pat,lv){ for(let l=lv+1;l<=maxLv(pat);l++){const e=exAt(pat,l); if(e) return e;} return null; }

function exForToday(pat){ const o=todayOverride().map; if(pat in o){ return o[pat]?EX_BY_ID[o[pat]]:null; } return pickEx(pat); }

/* 今日の目標回数：前回の最小回数 +1（時間なら+5秒）。きつかったら据え置き、楽なら+2 */
function targetFor(ex,mode){

  else{ const base=Math.min(...last.reps); t= last.fb==='hard'?base : last.fb==='easy'?base+step*2 : base+step; }
  t=clamp(t,ex.range[0],ex.range[1]);
  if(mode==='comeback'||mode==='deload') t=Math.max(ex.range[0],Math.round(t*0.7/step)*step);
  return t;
}

/* ---------- 期分け・回復マップ・痛み・コンディション・停滞・実績・テスト ---------- */
function patternLastDates(){ const m={}; trainSessions().forEach(s=>s.items.forEach(i=>{ if(!m[i.pat]||m[i.pat]<s.date) m[i.pat]=s.date; })); return m; }

function programWeek(){
  const first=trainSessions().map(s=>s.date).sort()[0]||S.profile.created; const ws=weekStart(dkey());
  const weeks=Math.max(0,Math.round(daysBetween(weekStart(first),ws)/7)); let phase=weeks%4;
  if(S.program.deload.includes(ws)) phase=3; else if(phase===3&&S.program.skipDeload.includes(ws)) phase=1;
  return {week:weeks+1,cycle:Math.floor(weeks/4)+1,phase,ws};
}
/* 型（A/B/C）の選択：あいている部位が多い型を優先。差がなければ順番どおり */
function chooseTemplate(avoid,last){
  const lastD=patternLastDates(); const today=dkey();
  const order=activeOrder(); const idx=last?order.indexOf(last.tpl):-1; const rot=idx>=0?order[(idx+1)%order.length]:order[0];

    if(k===rot) sc+=0.5; gaps[k]=g.join('・'); if(sc>bestScore){bestScore=sc;best=k;} });
  return {tpl:best,gaps};
}

function activeOrder(){ const sp=S.settings.split||'auto'; if(sp==='full') return TPL_ORDER; if(sp==='ul') return TPL_UL; return (S.profile.days>=4||programWeek().week>=9)?TPL_UL:TPL_ORDER; }
function weekStreak(){ let ws=weekStart(dkey()); let k=0; if(sessionsInWeek(ws).length>=S.profile.days) k++; ws=addDays(ws,-7); while(sessionsInWeek(ws).length>=S.profile.days&&k<600){ k++; ws=addDays(ws,-7); } return k; }
function weekReport(ws){
  const ss=sessionsInWeek(ws); const perPat={}; PAT_ORDER.forEach(p=>perPat[p]=0); let sets=0,reps=0,ups=0;
  ss.forEach(s=>{ ups+=(s.ups||[]).length; s.items.forEach(i=>{ sets+=i.sets.length; reps+=i.sets.reduce((a,b)=>a+b,0); if(perPat[i.pat]!==undefined) perPat[i.pat]+=i.sets.length; }); });

/* 停滞：直近3回の「最小セット回数」が伸びていない種目 */
function plateaus(){

}

function dietStats(){

  const within=(from,to)=>body.filter(b=>b.date>=from&&b.date<=to).map(b=>b.kg);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const avg7=mean(within(addDays(today,-6),today)), prev7=mean(within(addDays(today,-13),addDays(today,-7)));
  const latest=body.length?body[body.length-1].kg:null; const cur=avg7??latest;
  const base=addDays(today,-13); const pts=body.filter(b=>b.date>=base).map(b=>[daysBetween(base,b.date),b.kg]); let slope=null;
  if(pts.length>=4){ const k=pts.length,sx=pts.reduce((a,q)=>a+q[0],0),sy=pts.reduce((a,q)=>a+q[1],0),sxx=pts.reduce((a,q)=>a+q[0]*q[0],0),sxy=pts.reduce((a,q)=>a+q[0]*q[1],0); const d=k*sxx-sx*sx; if(d) slope=(k*sxy-sx*sy)/d; }

  const progress=(D.startKg&&D.goalKg&&cur!=null&&D.startKg!==D.goalKg)?clamp((D.startKg-cur)/(D.startKg-D.goalKg),0,1):0;
  const bmr=(D.height&&cur!=null&&D.age)?(10*cur+6.25*D.height-5*D.age+(D.sex==='m'?5:D.sex==='f'?-161:-78)):null;

/* チェックテスト（4週に1回の答え合わせ） */
function openTest(){
  const pushEx=pickEx('push'); const T={push:0,squat:0,plank:0,running:false,start:0}; let swT=null;
  const draw=()=>{
    $('#modalBox').innerHTML=`<div class="handle"></div><h3>📏 チェックテスト</h3><p class="muted">それぞれ全力で1回ずつ。間に2〜3分休む。フォームが崩れたらそこで終わり。</p>
      <label class="f">1. ${esc(pushEx.name)}：続けて最大何回？</label><div class="stepper"><button data-st="push" data-d="-1">−</button><div><b id="tPush">${T.push}</b><small>回</small></div><button data-st="push" data-d="1">＋</button></div>
      <label class="f">2. スクワット（太ももが床と平行まで）：最大何回？</label><div class="stepper"><button data-st="squat" data-d="-1">−</button><div><b id="tSquat">${T.squat}</b><small>回</small></div><button data-st="squat" data-d="1">＋</button></div>
      <label class="f">3. プランク：最長何秒？</label><div class="row"><div class="stepper grow" style="margin:0"><button data-st="plank" data-d="-5">−</button><div><b id="tPlank">${T.plank}</b><small>秒</small></div><button data-st="plank" data-d="5">＋</button></div><button class="btn sub xs" id="swBtn">${T.running?'⏹ 止める':'▶ 計る'}</button></div>
      <div class="tiny mt">スコア＝腕立て×2＋スクワット＋プランク秒÷2。${S.tests.length?`前回のスコア ${S.tests[S.tests.length-1].score}`:'はじめてのテスト'}</div>
      <div class="btnrow mt"><button class="btn sub" id="tsNo">やめる</button><button class="btn ok" id="tsOk">保存する</button></div>`;
    $$('#modalBox [data-st]').forEach(b=>b.onclick=()=>{ const k=b.dataset.st; T[k]=Math.max(0,Math.min(999,T[k]+(+b.dataset.d))); $('#t'+k[0].toUpperCase()+k.slice(1)).textContent=T[k]; });
    $('#swBtn').onclick=()=>{ if(T.running){ T.running=false; clearInterval(swT); T.plank=Math.round((Date.now()-T.start)/1000); chime(); draw(); } else { audioInit(); T.running=true; T.start=Date.now(); beep(1320,.2,.3); swT=setInterval(()=>{ const el=$('#tPlank'); if(el) el.textContent=Math.round((Date.now()-T.start)/1000); },250); $('#swBtn').textContent='⏹ 止める'; } };
    $('#tsNo').onclick=()=>{ clearInterval(swT); closeModal(); };
    $('#tsOk').onclick=()=>{ clearInterval(swT); if(T.running) T.plank=Math.round((Date.now()-T.start)/1000);
      const score=T.push*2+T.squat+Math.round(T.plank/2); const prev=S.tests[S.tests.length-1];
      S.tests=S.tests.filter(t=>t.date!==dkey()); S.tests.push({date:dkey(),pushEx:pushEx.id,push:T.push,squat:T.squat,plank:T.plank,score});
      const fresh=checkBadges(); save(); closeModal(); render();
      toast(prev?`スコア ${score}（前回 ${prev.score} → ${score>prev.score?'+'+(score-prev.score)+'、伸びた！':score===prev.score?'同じ':'−'+(prev.score-score)}）`:`スコア ${score} を記録。4週後にまた測ろう`);
      if(fresh.length) setTimeout(()=>toast(`実績「${fresh[0].name}」を獲得！`),2400); };
  };
  openModal(''); draw();
}
/* ホーム画面での一時的な選択（時間・型・モード） */
const H={tpl:null,mins:null,mode:null};

function buildMenu(tpl,mins,mode){
  const T=TEMPLATES[tpl], P=TIME_PLAN[mins]||TIME_PLAN[20];
  let nEx=P.ex, sets=P.sets;
  if(mode==='light'||mode==='comeback'||mode==='deload') sets=Math.max(1,sets-1);
  if(mode==='comeback') nEx=Math.min(nEx,4);
  const main=[]; const o=todayOverride(); const custom=!!(o.list&&o.list.length); const avoid=avoidPats();
  if(custom){ o.list.forEach(id=>{ const ex=EX_BY_ID[id]; if(ex&&hasEquip(ex.need)&&!avoid.includes(ex.pat)) main.push({pat:ex.pat,ex,sets,target:targetFor(ex,mode)}); }); }
  else{
    for(const pat of T.pats){ if(main.length>=nEx) break; if(avoid.includes(pat)) continue; const ex=exForToday(pat); if(!ex) continue; main.push({pat,ex,sets,target:targetFor(ex,mode)}); }
    // 痛みや「とばす」で減ったぶんは、型に入っていないパターンで埋める
    for(const pat of PAT_ORDER){ if(main.length>=nEx) break; if(avoid.includes(pat)||main.some(m=>m.pat===pat)||(pat in o.map&&!o.map[pat])) continue; const ex=exForToday(pat); if(ex) main.push({pat,ex,sets,target:targetFor(ex,mode)}); }
  }
  const warm=T.warm.slice(0,P.warm).map(k=>WARM[k]);
  const cool=T.cool.slice(0,P.cool).map(k=>COOL[k]);
  const menu={tpl,mins,mode,warm,main,cool,custom}; menu.est=estimate(menu); return menu;
}
function estimate(menu){
  let s=0;
  menu.warm.forEach(w=>s+=w.secs*(w.sides?2:1)+S.settings.prep+4);
  menu.main.forEach(m=>{ const work=m.ex.kind==='time'?m.target*(m.ex.sides?2:1)+S.settings.prep*2:m.target*3*(m.ex.sides?2:1)+6; s+=m.sets*work+(m.sets-1)*restFor(m.ex)+25; });
  menu.cool.forEach(c=>s+=c.secs*(c.sides?2:1)+S.settings.prep+4);
  return s;
}

/* ---------- 棒人間 ---------- */
function figSVG(key,opts={}){
  const F=FIGS[key]||FIGS.stand; const A=F.a;
  const seg=(p,q,cls)=>`<line data-s="${p}-${q}" class="${cls}" x1="0" y1="0" x2="0" y2="0"/>`;
  let props='', gear='';
  (F.props||[]).forEach(p=>{
    if(p.t==='rect') props+=`<rect class="prop" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="1.5"/>`;
    else if(p.t==='line') props+=`<line class="propline" x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}"/>`;
    else if(p.t==='bar') props+=`<line class="propline" x1="${p.x1}" y1="${p.y}" x2="${p.x2}" y2="${p.y}"/>`;
    else if(p.t==='anchor') props+=`<line data-s="anchor:${p.from}" data-tx="${p.x}" data-ty="${p.y}" class="band" x1="0" y1="0" x2="0" y2="0"/>`;
    else if(p.t==='link') props+=`<line data-s="link:${p.from}:${p.to}" class="band" x1="0" y1="0" x2="0" y2="0"/>`;
    else if(p.t==='pack') props+=`<rect data-s="pack" class="gear" x="0" y="0" width="11" height="8" rx="2"/>`;
    else if(p.t==='db') gear+=`<rect data-s="db:${p.at}" data-sz="${p.s||1}" class="gear" x="0" y="0" width="${8*(p.s||1)}" height="${4*(p.s||1)}" rx="1"/>`;
  });
  const ground=F.ground===false?'':`<line class="ground" x1="6" y1="92" x2="154" y2="92"/>`;
  let body='';
  if(A.k2) body+=seg('hp','k2','body2')+seg('k2','a2','body2')+`<line data-s="foot2" class="body2" x1="0" y1="0" x2="0" y2="0"/>`;
  if(A.e2) body+=seg('n','e2','body2')+seg('e2','w2','body2');
  body+=seg('n','hp','body')+seg('hp','k','body')+seg('k','a','body')+`<line data-s="foot" class="body" x1="0" y1="0" x2="0" y2="0"/>`+seg('n','e','body')+seg('e','w','body');
  // 顔：鼻（頭からの出っぱり）と目で、どっちが前か分かるようにする
  body+=`<line data-s="nose" class="nose" x1="0" y1="0" x2="0" y2="0"/><circle data-s="h" class="head" cx="0" cy="0" r="6"/><circle data-s="eye" class="eye" cx="0" cy="0" r="1.7"/>`;
  return `<svg viewBox="0 0 160 100" data-fig="${key}" ${opts.static?'data-static="1"':''} preserveAspectRatio="xMidYMid meet">${ground}${props}${body}${gear}</svg>`;
}
const lerp=(p,q,t)=>p+(q-p)*t;
const angPair=v=>v===undefined?[0,0]:Array.isArray(v)?v:[v,v];
function poseAt(key,t){
  const F=FIGS[key]||FIGS.stand, A=F.a, B=F.b||{}; const P={};
  for(const k in A){ const p=A[k], q=B[k]||p; P[k]=[lerp(p[0],q[0],t), lerp(p[1],q[1],t)]; }
  const fa=angPair(F.face), ta=angPair(F.toes), tb=angPair(F.toes2===undefined?F.toes:F.toes2);
  P._face=lerp(fa[0],fa[1],t); P._toes=lerp(ta[0],ta[1],t); P._toes2=lerp(tb[0],tb[1],t);
  return P;
}
function applyPose(svg,P){
  const rad=d=>d*Math.PI/180;
  svg.querySelectorAll('[data-s]').forEach(el=>{
    const s=el.dataset.s;
    if(s==='h'){ el.setAttribute('cx',P.h[0]); el.setAttribute('cy',P.h[1]); return; }
    if(s==='eye'){ const a=rad(P._face-28); el.setAttribute('cx',P.h[0]+Math.cos(a)*2.6); el.setAttribute('cy',P.h[1]+Math.sin(a)*2.6); return; }
    if(s==='nose'){ const a=rad(P._face); el.setAttribute('x1',P.h[0]+Math.cos(a)*3); el.setAttribute('y1',P.h[1]+Math.sin(a)*3); el.setAttribute('x2',P.h[0]+Math.cos(a)*8.5); el.setAttribute('y2',P.h[1]+Math.sin(a)*8.5); return; }
    if(s==='foot'||s==='foot2'){ const pt=s==='foot'?P.a:P.a2; if(!pt) return; const a=rad(s==='foot'?P._toes:P._toes2); el.setAttribute('x1',pt[0]); el.setAttribute('y1',pt[1]); el.setAttribute('x2',pt[0]+Math.cos(a)*8); el.setAttribute('y2',pt[1]+Math.sin(a)*8); return; }
    if(s.startsWith('anchor:')){ const pt=P[s.slice(7)]; if(!pt) return; el.setAttribute('x1',pt[0]); el.setAttribute('y1',pt[1]); el.setAttribute('x2',el.dataset.tx); el.setAttribute('y2',el.dataset.ty); return; }
    if(s.startsWith('link:')){ const [,f,to]=s.split(':'); if(!P[f]||!P[to]) return; el.setAttribute('x1',P[f][0]); el.setAttribute('y1',P[f][1]); el.setAttribute('x2',P[to][0]); el.setAttribute('y2',P[to][1]); return; }
    if(s.startsWith('db:')){ const pt=P[s.slice(3)]; if(!pt) return; const sz=+el.dataset.sz||1; el.setAttribute('x',pt[0]-4*sz); el.setAttribute('y',pt[1]-2*sz); return; }
    if(s==='pack'){ const nn=P.n,hp=P.hp; const dx=hp[0]-nn[0],dy=hp[1]-nn[1]; const L=Math.hypot(dx,dy)||1; const ux=dx/L,uy=dy/L; const cx=nn[0]+dx*0.3-uy*7, cy=nn[1]+dy*0.3+ux*7; el.setAttribute('x',cx-5.5); el.setAttribute('y',cy-4); return; }
    const [p,q]=s.split('-'); if(!P[p]||!P[q]) return;
    el.setAttribute('x1',P[p][0]); el.setAttribute('y1',P[p][1]); el.setAttribute('x2',P[q][0]); el.setAttribute('y2',P[q][1]);
  });
}
/* 図の下に出す説明（どっちが前か） */
const figCap=key=>{ const F=FIGS[key]; return `<div class="tiny center" style="margin-top:5px">横から見た図（${esc(F&&F.pos||'')}）・頭のとがった側が<b>顔＝前</b>、足先の短い線が<b>つま先</b></div>`; };
function animLoop(){
  const now=performance.now();
  const t=(1-Math.cos(now/1400*Math.PI))/2;
  document.querySelectorAll('svg[data-fig]').forEach(svg=>{
    if(svg.dataset.static==='1'){ if(!svg.dataset.init){ applyPose(svg,poseAt(svg.dataset.fig,0)); svg.dataset.init='1'; } return; }
    if(!svg.getClientRects().length) return; // 非表示なら飛ばす
    applyPose(svg,poseAt(svg.dataset.fig,t));
  });
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

let AC=null;
function audioInit(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(freq=880,dur=0.12,vol=0.25){
  if(!S.settings.sound||!AC) return;
  try{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.start(t); o.stop(t+dur+0.02); }catch(e){}
}
function chime(){ beep(660,.12); setTimeout(()=>beep(880,.12),130); setTimeout(()=>beep(1320,.3,.3),260); }
function vib(p){ if(S.settings.vib&&navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }
let wl=null;
async function wakeLock(on){ try{ if(on&&'wakeLock' in navigator){ wl=await navigator.wakeLock.request('screen'); } else if(!on&&wl){ await wl.release(); wl=null; } }catch(e){} }

  $('#v-home').innerHTML=hero+dietCard+dietPrompt+cardioCard+snackCard+recov+painCard+plateauCard+testCard+`

    ${(()=>{ const total=PAT_ORDER.reduce((a,pt)=>a+S.levels[pt],0); const L=S.levels; return `<div class="avatarbox">${avatarSVG(84)}<div class="grow"><b style="font-size:16px">じぶん人形：${rankName(total)}</b><div class="tiny">筋肉ポイント ${total}/45 ・ 腕 ${((L.push+L.pull+L.vpush)/3).toFixed(1)} ／ 脚 ${((L.squat+L.lunge+L.hinge)/3).toFixed(1)} ／ 体幹 ${L.core}</div><div class="tiny">レベルが上がるほど、腕・脚・体幹が太くなる</div></div></div>`; })()}
    <div class="lvgrid">${PAT_ORDER.map(pat=>`<div class="lv" data-pat="${pat}" style="--pc:${PATTERNS[pat].color}"><b>${PATTERNS[pat].name}</b><span>${S.levels[pat]}</span><small>/ ${maxLv(pat)}</small></div>`).join('')}</div></div>

  const pa=$('#painAdd'); if(pa) pa.onclick=openPain;

  const cb=$('#circuitBtn'); if(cb) cb.onclick=startCircuit; const wb=$('#walkBtn'); if(wb) wb.onclick=openWalkLog;

/* 種目の入れ替え */
function openSwap(pat){
  const o=todayOverride(); const cur=o.list?EX_BY_ID[o.list.find(id=>EX_BY_ID[id]&&EX_BY_ID[id].pat===pat)]:exForToday(pat); const L=ladder(pat);
  const opts=L.filter(e=>hasEquip(e.need)).map(e=>{
    const tag=cur&&e.id===cur.id?'いま':e.lv<S.levels[pat]?'やさしい':e.lv>S.levels[pat]?'むずかしい':'同じレベル';
    return `<div class="st ${cur&&e.id===cur.id?'cur':''}" data-ex="${e.id}" style="--pc:${PATTERNS[pat].color}"><div class="num">${e.lv}</div><div class="fig" style="width:52px;height:34px;flex:none;background:var(--bg2);border-radius:8px">${figSVG(e.fig,{static:true})}</div><div><div class="nm">${esc(e.name)}</div><div class="meta">${tag} ・ ${e.range[0]}〜${e.range[1]}${unit(e)}${e.sides?' ・左右':''}${e.need?' ・'+needName(e):''}</div></div></div>`; }).join('');
  openModal(`<h3>${PATTERNS[pat].name}の種目を入れ替え</h3><p class="muted">今日だけ変えます（レベルは変わりません）。難しいほうを最後までこなせたら、次回からそのレベルになります。</p><div class="ladder">${opts}</div><button class="btn ghost mt" id="skipPat">今日はこのパターンをとばす</button>`);
  $$('#modalBox .st').forEach(el=>el.onclick=()=>{ const o=todayOverride(); if(o.list){ const i=o.list.findIndex(id=>EX_BY_ID[id]&&EX_BY_ID[id].pat===pat); if(i>=0) o.list[i]=el.dataset.ex; else o.list.push(el.dataset.ex); } else o.map[pat]=el.dataset.ex; save(); closeModal(); renderHome(); });
  $('#skipPat').onclick=()=>{ const o=todayOverride(); if(o.list) o.list=o.list.filter(id=>!(EX_BY_ID[id]&&EX_BY_ID[id].pat===pat)); else o.map[pat]=null; save(); closeModal(); renderHome(); toast(`${PATTERNS[pat].name}を今日はとばします`); };
}
/* メニュービルダー：レベルでまとめて／種目ごとに、今日のメニューを決める */
function openMenuBuilder(){
  const T=TEMPLATES[H.tpl]; const order=[...T.pats,...PAT_ORDER.filter(p=>!T.pats.includes(p))];
  const menu=buildMenu(H.tpl,H.mins,H.mode);
  const B={lv:0,sel:{},persist:false}; order.forEach(p=>B.sel[p]=null); menu.main.forEach(m=>B.sel[m.pat]=m.ex.id);
  const maxAll=Math.max(...PAT_ORDER.map(maxLv));
  const draw=()=>{
    const chips=`<div class="choice"><button data-lv="0" aria-pressed="${B.lv===0}">いつもの<small>自動</small></button>${[...Array(maxAll)].map((_,i)=>`<button data-lv="${i+1}" aria-pressed="${B.lv===i+1}" style="min-width:56px">Lv.${i+1}</button>`).join('')}</div>`;
    const rows=order.map(p=>{ const opts=ladder(p).filter(e=>hasEquip(e.need)); const on=!!B.sel[p];
      return `<div class="mbrow ${on?'':'off'}"><label class="check"><input type="checkbox" data-inc="${p}" ${on?'checked':''}><div>${PATTERNS[p].emoji} ${PATTERNS[p].name}<small>${T.pats.includes(p)?'今日の型に入っている':'追加'}</small></div></label><select data-pat="${p}" ${on?'':'disabled'}>${opts.map(e=>`<option value="${e.id}" ${B.sel[p]===e.id?'selected':''}>Lv.${e.lv} ${esc(e.name)}${e.need?' '+needs(e).map(k=>EQUIP[k].emoji).join(''):''}</option>`).join('')}</select></div>`; }).join('');
    const picked=order.filter(p=>B.sel[p]).map(p=>EX_BY_ID[B.sel[p]]);
    const gear=[...new Set(picked.flatMap(needs))];
    $('#modalBox').innerHTML=`<div class="handle"></div><h3>メニューを決める</h3><p class="muted">今日のメニューを、レベルでまとめて／種目ごとに選べます。チェックを外したパターンはやりません。</p>
      <b style="font-size:14px">レベルでまとめて選ぶ</b><div class="tiny" style="margin-bottom:6px">レベルは「いまのレベル」（ホームの表）の段。道具がない種目は自動で一段下になります。</div>${chips}
      <b style="font-size:14px;display:block;margin-top:14px">種目ごとに選ぶ</b>${rows}
      <div class="tiny mt">${picked.length}種目 ・ ${gear.length?'使う道具：'+gear.map(k=>EQUIP[k].emoji+esc(EQUIP[k].name.split('・')[0])).join('、'):'道具なし'}</div>
      <label class="check mt"><input type="checkbox" id="mbPersist" ${B.persist?'checked':''}><div>次回からもこのレベルにする<small>各パターンの「いまのレベル」を、選んだ種目の段に変更します</small></div></label>
      <div class="btnrow mt"><button class="btn sub" id="mbReset">自動にもどす</button><button class="btn" id="mbApply">このメニューにする</button></div>`;
    $$('#modalBox [data-lv]').forEach(b=>b.onclick=()=>{ B.lv=+b.dataset.lv; order.forEach(p=>{ if(!B.sel[p]) return; B.sel[p]=(B.lv===0?pickEx(p):pickEx(p,Math.min(B.lv,maxLv(p)))).id; }); draw(); });
    $$('#modalBox [data-inc]').forEach(c=>c.onchange=()=>{ const p=c.dataset.inc; B.sel[p]=c.checked?(B.lv===0?pickEx(p):pickEx(p,Math.min(B.lv,maxLv(p)))).id:null; draw(); });
    $$('#modalBox select[data-pat]').forEach(sl=>sl.onchange=()=>{ B.sel[sl.dataset.pat]=sl.value; draw(); });
    $('#mbPersist').onchange=e=>{B.persist=e.target.checked;};
    $('#mbReset').onclick=()=>{ S.override={date:'',map:{},list:null}; save(); closeModal(); renderHome(); toast('自動のメニューにもどしました'); };
    $('#mbApply').onclick=()=>{ const list=order.filter(p=>B.sel[p]).map(p=>B.sel[p]); if(!list.length){toast('1つ以上えらんでください');return;}
      const o=todayOverride(); o.list=list; o.map={};
      if(B.persist){ list.forEach(id=>{ const e=EX_BY_ID[id]; S.levels[e.pat]=e.lv; }); }
      save(); closeModal(); renderHome(); toast(B.persist?'メニューとレベルを変更しました':'今日のメニューを決めました'); };
  };
  openModal(''); draw();
}
/* ラダー表示（レベルの詳細） */
function openLadder(pat){
  const L=ladder(pat); const cur=S.levels[pat];
  openModal(`<h3>${PATTERNS[pat].emoji} ${PATTERNS[pat].name} <span class="tiny">${PATTERNS[pat].sub}</span></h3>
    <p class="muted">回数の上限まで届いたら次の段へ。「きつすぎ」が2回続くと一段もどります。設定からも手動で変えられます。</p>
    <div class="ladder">${L.map(e=>{ const na=!hasEquip(e.need); const best=S.last[e.id]?Math.max(...S.last[e.id].reps):null;
      return `<div class="st ${e.lv===cur?'cur':e.lv<cur?'done':''} ${na?'na':''}" data-ex="${e.id}" style="--pc:${PATTERNS[pat].color}"><div class="num">${e.lv<cur&&!na?'✓':e.lv}</div><div><div class="nm">${esc(e.name)}</div><div class="meta">${e.range[0]}〜${e.range[1]}${unit(e)}${e.sides?' ・左右':''}${e.need?' ・要 '+needName(e):''}${na?'（道具がないので飛ばす）':''}${!na&&pickEx(pat,e.lv).id===e.id&&e.lv===cur?' ・いま使う種目':''}</div></div><div class="rt">${best!==null?'最高 '+best+unit(e):''}</div></div>`; }).join('')}</div>`);
  $$('#modalBox .st').forEach(el=>el.onclick=()=>openExDetail(el.dataset.ex));
}
function openExDetail(id){
  const e=EX_BY_ID[id]; const pat=e.pat; const last=S.last[e.id];
  openModal(`<h3>${esc(e.name)} <span class="tiny">Lv.${e.lv}</span></h3>
    <div class="row wrap" style="gap:6px;margin-bottom:8px">${patPill(pat)}<span class="pill">${e.range[0]}〜${e.range[1]}${unit(e)}</span>${e.sides?'<span class="pill">左右</span>':''}${e.need?`<span class="pill info">要 ${esc(needName(e))}</span>`:''}</div>
    <div class="figbig fig">${figSVG(e.fig)}</div>${figCap(e.fig)}
    <p class="muted mt">${esc(e.desc)}</p>
    <b style="font-size:14px">やり方</b><ul class="cues">${e.how.map((h,i)=>`<li data-n="${i+1}">${esc(h)}</li>`).join('')}</ul>
    <b style="font-size:14px">よくあるミス</b><ul class="cues miss">${e.miss.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>
    <div class="row wrap mt" style="gap:8px"><span class="pill ok">楽にする: ${esc(e.easy)}</span><span class="pill warn">きつくする: ${esc(e.hard)}</span></div>
    ${last?`<p class="tiny mt">前回 ${fmtDate(last.date)}：${last.reps.join(' / ')}${unit(e)}（${({easy:'楽すぎ',ok:'ちょうど',hard:'きつすぎ'})[last.fb]||'—'}）</p>`:''}
    ${(()=>{ const hs=trainSessions().sort((a,b)=>a.date<b.date?-1:1).flatMap(s=>s.items.filter(i=>i.ex===e.id&&i.sets.length).map(i=>({d:s.date,v:Math.min(...i.sets)}))).slice(-12); if(hs.length<2) return ''; const vals=hs.map(h=>h.v); const mn=Math.min(...vals,e.range[0])-1, mx=Math.max(...vals,e.range[1])+1; const BW=320,BH=90,pl=26,pb=16; const X=i=>pl+i*(BW-pl-8)/(hs.length-1), Y=v=>BH-pb-(v-mn)/(mx-mn)*(BH-pb-8); return `<div class="mt"><b style="font-size:14px">回数の推移 <span class="tiny">（各回の最小セット）</span></b><svg class="chart" viewBox="0 0 ${BW} ${BH}"><line class="goal" x1="${pl}" y1="${Y(e.range[1])}" x2="${BW-4}" y2="${Y(e.range[1])}"/><text x="2" y="${Y(e.range[1])+4}">上限</text><polyline class="ln" points="${hs.map((h,i)=>`${X(i)},${Y(h.v)}`).join(' ')}"/>${hs.map((h,i)=>`<circle class="pt" cx="${X(i)}" cy="${Y(h.v)}" r="3"/>`).join('')}<text x="${X(0)}" y="${BH-3}">${fmtDate(hs[0].d)}</text><text x="${X(hs.length-1)}" y="${BH-3}" text-anchor="end">${fmtDate(hs[hs.length-1].d)}</text></svg></div>`; })()}
    ${hasEquip(e.need)&&S.levels[pat]!==e.lv?`<button class="btn sub mt" id="setLv">この種目を「いまのレベル」にする</button>`:''}
    <div class="mt"><input type="text" id="aiQ" placeholder="🤖 この種目について質問（例: 手首が痛くなる）" maxlength="120"><button class="btn sub sm mt" id="aiAsk">AIコーチに聞く</button><div id="aiAns"></div></div>`);
  const b=$('#setLv'); if(b) b.onclick=()=>{ S.levels[pat]=e.lv; save(); closeModal(); render(); toast(`${PATTERNS[pat].name}をLv.${e.lv}にしました`); };
  $('#aiAsk').onclick=()=>{ const q=$('#aiQ').value.trim(); if(!q){toast('質問を入力してください');return;} runAI($('#aiAsk'),$('#aiAns'),`種目「${e.name}」（${PATTERNS[pat].name}、Lv.${e.lv}）についての質問：${q}\nやり方：${e.how.join('／')}\nよくあるミス：${e.miss.join('／')}\n${aiContext()}`); };
}

/* =====================================================================
   トレーニング実行
   ===================================================================== */
const R={on:false,menu:null,stages:[],si:0,set:1,side:0,phase:'intro',timer:null,startedAt:0,kind:'train',saved:null,lastBeep:null};
let tickT=null;

function startStretch(){
  const items=['child','ham','glute','chest','quad','neck'].map(k=>COOL[k]);
  const menu={tpl:null,mins:5,mode:'stretch',warm:[],main:[],cool:items}; menu.est=estimate(menu);
  beginRun(menu,'stretch');
}
function startWorkout(menu){ if(!menu.main.length){toast('種目がありません。設定で道具を確認してください');return;} beginRun(menu,'train'); }
function beginRun(menu,kind){
  R.menu=menu; R.kind=kind; R.stages=[]; R.saved=null; R.newBadges=[]; R.spoken=null; R.quiz=null; R.mirror=false;
  if(S.settings.mirror&&kind!=='stretch') setTimeout(mirrorStart,300);
  menu.warm.forEach(w=>R.stages.push({type:'timed',item:w,group:'warm',secs:w.secs}));
  menu.main.forEach(m=>R.stages.push({type:'ex',pat:m.pat,ex:m.ex,sets:m.sets,target:m.target,results:[],fb:null}));
  (menu.cardio||[]).forEach(c=>R.stages.push({type:'timed',item:c,group:'cardio',secs:c.secs}));
  menu.cool.forEach(c=>R.stages.push({type:'timed',item:c,group:'cool',secs:c.secs}));
  R.stages.push({type:'done'});
  R.si=0; R.set=1; R.side=0; R.phase='intro'; R.timer=null; R.startedAt=Date.now(); R.on=true;
  $('#exec').classList.add('on'); document.body.style.overflow='hidden';
  audioInit(); wakeLock(true); clearInterval(tickT); tickT=setInterval(tick,250);
  $('#execSound').textContent=S.settings.sound?'🔊':'🔇';
  renderExec();
}
function endRun(){ R.on=false; clearInterval(tickT); R.timer=null; tempoStop(); mirrorStop(); try{speechSynthesis.cancel();}catch(e){} $('#exec').classList.remove('on'); document.body.style.overflow=''; wakeLock(false); render(); }
$('#execClose').onclick=()=>{
  const anyDone=R.stages.some(s=>s.type==='ex'&&s.results.length);
  if(R.stages[R.si].type==='done'){ endRun(); return; }
  confirmBox('途中で終了しますか？', anyDone?'ここまでのセットは記録として保存されます。':'まだ何も記録されていません。','終了する',()=>{ if(anyDone&&!R.saved) finishSession(true); endRun(); },true);
};
$('#execSound').onclick=()=>{ S.settings.sound=!S.settings.sound; save(); $('#execSound').textContent=S.settings.sound?'🔊':'🔇'; };

const stage=()=>R.stages[R.si];
function progressPct(){ const n=R.stages.length-1; return Math.round(R.si/n*100); }
function setTimer(kind,secs){ R.timer={kind,total:secs,endAt:Date.now()+secs*1000,paused:false,remain:secs}; R.lastBeep=null; }
function pauseTimer(){ if(!R.timer||R.timer.paused) return; R.timer.paused=true; R.timer.remainMs=R.timer.endAt-Date.now(); renderExec(); }
function resumeTimer(){ if(!R.timer||!R.timer.paused) return; R.timer.paused=false; R.timer.endAt=Date.now()+R.timer.remainMs; renderExec(); }
function timerRemain(){ if(!R.timer) return 0; const ms=R.timer.paused?R.timer.remainMs:R.timer.endAt-Date.now(); return Math.max(0,Math.ceil(ms/1000)); }

function tick(){
  if(!R.on||!R.timer||R.timer.paused) return;
  const rem=timerRemain();
  const num=$('#tNum'), ring=$('#tRing');
  if(num) num.textContent=rem;
  if(ring){ const C=2*Math.PI*100; ring.style.strokeDashoffset=C*(1-rem/R.timer.total); }
  if(rem<=3&&rem>0&&R.lastBeep!==rem){ R.lastBeep=rem; beep(rem===1?990:880,.1,.2); }
  if(rem<=0){ const t=R.timer; R.timer=null; onTimerEnd(t.kind); }
}
function onTimerEnd(kind){
  const st=stage();
  if(kind==='prep'){ R.phase='run'; setTimer('run',currentSecs()); beep(1320,.2,.3); vib(80); speak('スタート'); renderExec(); return; }
  if(kind==='switch'){ R.phase='run'; setTimer('run',currentSecs()); beep(1320,.2,.3); vib(80); speak('反対側、スタート'); renderExec(); return; }
  if(kind==='run'){
    const sides=st.type==='timed'?st.item.sides:st.ex.sides;
    if(sides&&R.side===0){ R.side=1; R.phase='switch'; setTimer('switch',S.settings.prep); beep(660,.15); vib([60,60,60]); renderExec(); return; }
    chime(); vib([100,50,100]);
    if(st.type==='timed'){ advanceTimed(); return; }
    // 時間種目のセット完了
    st.results.push(currentSecs()); afterSet(); return;
  }
  if(kind==='rest'){ chime(); vib([100,50,100]); speak(`休憩おわり。セット${R.set}`); startSet(); return; }
}
function currentSecs(){ const st=stage(); return st.type==='timed'?st.secs:st.target; }

/* 準備運動・ストレッチの連続再生 */
function advanceTimed(){
  const cur=stage(); R.si++; R.set=1; R.side=0;
  const nx=stage();
  if(nx.type==='timed'&&nx.group===cur.group){ R.phase='prep'; setTimer('prep',cur.group==='cardio'?15:S.settings.prep); renderExec(); }
  else { R.phase='intro'; R.timer=null; if(nx.type==='done'){ finishSession(false); } renderExec(); }
}
function startSet(){
  const st=stage();
  if(st.ex.kind==='time'){ R.side=0; R.phase='prep'; setTimer('prep',S.settings.prep); }
  else { R.phase='work'; R.timer=null; R.reps=st.target; }
  renderExec();
}
function afterSet(){
  const st=stage();
  if(R.set<st.sets){ R.set++; R.phase='rest'; setTimer('rest',restFor(st.ex)); R.quiz=pickQuiz(); speak(`セット${R.set-1}おわり。${restFor(st.ex)}秒休憩`); renderExec(); }
  else { R.phase='fb'; R.timer=null; renderExec(); }
}
function nextStage(){
  R.si++; R.set=1; R.side=0; R.timer=null;
  const nx=stage();
  if(nx.type==='timed'){ R.phase='intro'; }
  else if(nx.type==='ex'){ R.phase='intro'; }
  else { R.phase='done'; finishSession(false); }
  renderExec(); $('#execBody').scrollTop=0;
}

/* ---------- 実行画面の描画 ---------- */
function ringHTML(kind,secs,label){
  const C=2*Math.PI*100; const rem=timerRemain(); const off=R.timer?C*(1-rem/R.timer.total):0;
  return `<div class="bigtimer"><svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="100"/><circle id="tRing" class="ring ${kind==='rest'?'rest':''}" cx="110" cy="110" r="100" stroke-dasharray="${C}" style="stroke-dashoffset:${off}"/></svg><div class="num"><div><b id="tNum">${rem}</b><small>${esc(label)}</small></div></div></div>`;
}
function cueList(list,cls=''){ return `<ul class="cues ${cls}">${list.map((h,i)=>`<li data-n="${i+1}">${esc(h)}</li>`).join('')}</ul>`; }
function nextBox(){
  const nx=R.stages[R.si+1]; if(!nx||nx.type==='done') return `<div class="nextbox"><div><b>次：おわり 🎉</b><small>あと少し！</small></div></div>`;
  const it=nx.type==='timed'?nx.item:nx.ex; const sub=nx.type==='timed'?`${nx.secs}秒${it.sides?'×左右':''}`:`${nx.sets}セット × ${nx.target}${unit(it)}`;
  return `<div class="nextbox"><div class="fig">${figSVG(it.fig)}</div><div><b>次：${esc(it.name)}</b><small>${sub}</small></div></div>`;
}
function renderExec(){
  renderExecInner();
  const mb=$('#mirrorBtn'); if(mb) mb.onclick=()=>{ if(R.mirror){ mirrorStop(); S.settings.mirror=false; save(); renderExec(); } else mirrorStart(); };
  setTimeout(attachMirror,0);
  const key=`${R.si}:${R.phase}:${R.set}:${R.side}`;
  if(R.spoken!==key){ R.spoken=key; const st=stage();
    if(st.type==='ex'&&R.phase==='intro') speak(`次は、${st.ex.name}。${st.sets}セット、目標${st.target}${unit(st.ex)}${st.ex.sides?'、左右それぞれ':''}`);
    else if(st.type==='timed'&&R.phase==='intro') speak(`${st.item.name}、${st.secs}秒${st.item.sides?'、左右':''}`);
    else if(st.type==='ex'&&R.phase==='fb') speak('この種目はどうだった？');
    else if(st.type==='done') speak(R.kind==='train'?'おつかれさま。今日の分は終わり。':'完了。');
  }
}
function renderExecInner(){
  const st=stage(); const body=$('#execBody'), foot=$('#execFoot');
  if(!(st.type==='ex'&&R.phase==='work')) tempoStop();
  $('#execBar').style.width=progressPct()+'%';
  const mainIdx=R.stages.filter((s,i)=>s.type==='ex'&&i<=R.si).length, mainN=R.stages.filter(s=>s.type==='ex').length;
  $('#execLbl').textContent= st.type==='timed'?(st.group==='warm'?'ウォームアップ':st.group==='cardio'?`サーキット ${R.si+1}/${R.stages.length-1}`:'クールダウン'):st.type==='ex'?`種目 ${mainIdx}/${mainN}`:'完了';
  if(st.type==='timed'){
    const it=st.item; const sideLbl=it.sides?`<span class="sidebadge">${R.side===0?'左':'右'}</span>`:'';
    if(R.phase==='intro'){
      body.innerHTML=`<div class="stagename">${st.group==='warm'?'WARM-UP':st.group==='cardio'?'CIRCUIT':'COOL-DOWN'}</div><div class="exname">${esc(it.name)}<small>${st.secs}秒${it.sides?' × 左右':''}</small></div><div class="figbig fig">${figSVG(it.fig)}</div>${figCap(it.fig)}${mirrorBox()}<div class="center mt">${mirrorBtn()}</div>${cueList(it.how)}<p class="tiny mt">${st.group==='warm'?'ケガを防いで、本番でちゃんと力が出るようにする時間。がんばらなくてOK。':st.group==='cardio'?'30秒動いて15秒休む×12。きつければ足ぶみでつなぐ。呼吸を止めない。息が上がれば脂肪は燃えている。':'使った筋肉をゆるめる時間。痛気持ちいいところで止めて、深呼吸。'}</p>`;
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="skipBtn">とばす</button><button class="btn" id="goBtn">スタート</button></div>`;
      $('#goBtn').onclick=()=>{ audioInit(); R.phase='prep'; setTimer('prep',S.settings.prep); renderExec(); };
      $('#skipBtn').onclick=()=>{ R.si++; const nx=stage(); R.phase='intro'; R.timer=null; if(nx.type==='done') finishSession(false); renderExec(); };
    }else if(R.phase==='prep'||R.phase==='switch'){
      body.innerHTML=`<div class="stagename">${R.phase==='switch'?'反対側に切りかえ':'準備'}</div><div class="exname">${esc(it.name)}${sideLbl}</div>${ringHTML('prep',0,R.phase==='switch'?'秒で反対側':'秒後にスタート')}<div class="figbig fig">${figSVG(it.fig)}</div>${cueList(it.how)}`;
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="skipBtn">とばす</button></div>`;
      $('#skipBtn').onclick=()=>{ R.timer=null; advanceTimed(); };
    }else if(R.phase==='run'){
      body.innerHTML=`<div class="stagename">${st.group==='warm'?'WARM-UP':st.group==='cardio'?'CIRCUIT':'COOL-DOWN'}</div><div class="exname">${esc(it.name)}${sideLbl}</div>${ringHTML('run',st.secs,'秒')}<div class="figbig fig" style="max-width:260px;aspect-ratio:16/9">${figSVG(it.fig)}</div><p class="muted center mt">${esc(it.how[0])}</p>`;
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="skipBtn">とばす</button><button class="btn sub" id="pauseBtn">${R.timer&&R.timer.paused?'▶ 再開':'⏸ 一時停止'}</button></div>`;
      $('#skipBtn').onclick=()=>{ R.timer=null; advanceTimed(); };
      $('#pauseBtn').onclick=()=>R.timer&&R.timer.paused?resumeTimer():pauseTimer();
    }
    return;
  }
  if(st.type==='ex'){
    const ex=st.ex; const dots=`<div class="setdots">${[...Array(st.sets)].map((_,i)=>`<i class="${i<R.set-1?'done':i===R.set-1?'cur':''}"></i>`).join('')}</div>`;
    const head=`<div class="stagename">${PATTERNS[st.pat].name.toUpperCase()} ・ Lv.${ex.lv}</div><div class="exname">${esc(ex.name)}<small>セット ${R.set}/${st.sets}</small></div>`;
    const sideLbl=ex.sides?`<span class="sidebadge">${R.side===0?'左':'右'}</span>`:'';
    if(R.phase==='intro'){
      body.innerHTML=`${head}${dots}<div class="figbig fig">${figSVG(ex.fig)}</div>${figCap(ex.fig)}${mirrorBox()}<div class="center mt">${mirrorBtn()}</div>
        <div class="target"><b>${st.sets} × ${st.target}<span style="font-size:20px">${unit(ex)}</span></b><small>${ex.sides?'左右それぞれ ・ ':''}目標（前回の記録から自動で決めています）</small></div>
        <b style="font-size:14px">やり方</b>${cueList(ex.how)}<b style="font-size:14px">よくあるミス</b>${cueList(ex.miss,'miss')}
        <p class="tiny mt">楽すぎたら：${esc(ex.easy)} ／ きつすぎたら：${esc(ex.hard)}</p>`;
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="skipBtn">この種目をとばす</button><button class="btn" id="goBtn">セット${R.set} スタート</button></div>`;
      $('#goBtn').onclick=()=>{ audioInit(); startSet(); };
      $('#skipBtn').onclick=()=>nextStage();
    }else if(R.phase==='work'){
      body.innerHTML=`${head}${dots}<div class="figbig fig" style="max-width:300px;aspect-ratio:16/9">${figSVG(ex.fig)}</div>
        <div class="target"><small>目標</small><b>${st.target}<span style="font-size:20px">回</span></b><small>${ex.sides?'左右それぞれ ・ ':''}下ろすときは2〜3秒かけて</small></div>
        <div class="stepper"><button id="repM">−</button><div><b id="repV">${R.reps}</b><small>できた回数</small></div><button id="repP">＋</button></div>
        <p class="tiny center">${esc(ex.how[1]||ex.how[0])}</p>
        <div class="center"><button class="iconbtn" id="tempoBtn">${S.settings.tempo?'🎵 テンポ音 ON':'🎵 テンポ音 OFF'}</button> ${mirrorBtn()}<div class="tiny">低い音で下ろしはじめ（2秒）→ 高い音で上げる（1秒）</div></div>${mirrorBox()}`;
      if(S.settings.tempo) tempoStart();
      $('#tempoBtn').onclick=()=>{ S.settings.tempo=!S.settings.tempo; save(); if(S.settings.tempo){ audioInit(); tempoStart(); } else tempoStop(); $('#tempoBtn').textContent=S.settings.tempo?'🎵 テンポ音 ON':'🎵 テンポ音 OFF'; };
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="stopBtn">ここでやめる</button><button class="btn ok" id="doneBtn">できた ✓</button></div>`;
      $('#repM').onclick=()=>{R.reps=Math.max(0,R.reps-1);$('#repV').textContent=R.reps;};
      $('#repP').onclick=()=>{R.reps=Math.min(99,R.reps+1);$('#repV').textContent=R.reps;};
      $('#doneBtn').onclick=()=>{ st.results.push(R.reps); afterSet(); };
      $('#stopBtn').onclick=()=>{ if(R.reps>0) st.results.push(R.reps); R.phase='fb'; R.timer=null; renderExec(); };
    }else if(R.phase==='prep'||R.phase==='switch'){
      body.innerHTML=`${head}${dots}<div class="stagename center" style="margin-top:6px">${R.phase==='switch'?'反対側に切りかえ':'準備'}</div>${ringHTML('prep',0,R.phase==='switch'?'秒で反対側':'秒後にスタート')}<div class="center">${sideLbl}</div><div class="figbig fig mt" style="max-width:260px;aspect-ratio:16/9">${figSVG(ex.fig)}</div><p class="muted center mt">${esc(ex.how[0])}</p>`;
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="skipPrep">すぐ始める</button></div>`;
      $('#skipPrep').onclick=()=>{ R.timer=null; onTimerEnd('prep'); };
    }else if(R.phase==='run'){
      body.innerHTML=`${head}${dots}${ringHTML('run',st.target,'秒キープ')}<div class="center">${sideLbl}</div><div class="figbig fig mt" style="max-width:260px;aspect-ratio:16/9">${figSVG(ex.fig)}</div><p class="muted center mt">${esc(ex.miss[0])} に注意。呼吸は止めない</p>`;
      foot.innerHTML=`<div class="btnrow"><button class="btn ghost" id="stopBtn">ここでやめる</button><button class="btn sub" id="pauseBtn">${R.timer&&R.timer.paused?'▶ 再開':'⏸ 一時停止'}</button></div>`;
      $('#pauseBtn').onclick=()=>R.timer&&R.timer.paused?resumeTimer():pauseTimer();
      $('#stopBtn').onclick=()=>{ const done=st.target-timerRemain(); R.timer=null; st.results.push(Math.max(0,done)); afterSet(); };
    }else if(R.phase==='rest'){
      const tip=ex.miss[Math.floor(Math.random()*ex.miss.length)];
      body.innerHTML=`${head}${dots}<div class="stagename center" style="margin-top:6px">休憩</div>${ringHTML('rest',0,'秒')}
        <div class="nextbox"><div class="fig">${figSVG(ex.fig)}</div><div><b>次：セット${R.set} ・ ${st.target}${unit(ex)}</b><small>前のセット：${st.results[st.results.length-1]}${unit(ex)}</small></div></div>
        <div class="tipbox">次のセットで意識：<b>${esc(tip)}</b></div>${R.quiz?quizHTML(R.quiz):''}`;
      if(R.quiz) bindQuiz(R.quiz);
      foot.innerHTML=`<div class="btnrow"><button class="btn sub" id="plusBtn">＋15秒</button><button class="btn" id="skipRest">休憩をとばす</button></div>`;
      $('#plusBtn').onclick=()=>{ if(R.timer){ R.timer.endAt+=15000; R.timer.total+=15; if(R.timer.paused) R.timer.remainMs+=15000; tick(); } };
      $('#skipRest').onclick=()=>{ const rem=timerRemain(); if(rem>restFor(ex)*0.6){ confirmBox('休憩が短すぎるかも',`まだ${rem}秒残っています。休憩が短いと次のセットの回数が落ちて、結果的に伸びにくくなります。`,'それでも進む',()=>{R.timer=null;startSet();}); } else { R.timer=null; startSet(); } };
    }else if(R.phase==='fb'){
      const res=st.results; const min=res.length?Math.min(...res):0;
      body.innerHTML=`${head}<div class="figbig fig" style="max-width:260px;aspect-ratio:16/9">${figSVG(ex.fig)}</div>
        <div class="target"><small>記録</small><b style="font-size:32px">${res.length?res.join(' / '):'—'}<span style="font-size:16px">${unit(ex)}</span></b><small>目標 ${st.target}${unit(ex)} × ${st.sets}セット</small></div>
        <h3 class="center" style="font-size:17px;margin-top:8px">この種目、どうだった？</h3>
        <div class="fbrow"><button data-fb="easy">😎 楽すぎ<small>まだ余裕</small></button><button data-fb="ok">🙂 ちょうど<small>あと2回できる</small></button><button data-fb="hard">🥵 きつすぎ<small>形がくずれた</small></button></div>
        <p class="tiny center">正直に答えるほど、次回の目標が正確になります${min>=ex.range[1]?'。上限に届いた！「楽すぎ／ちょうど」なら次回レベルアップ':''}</p>${nextBox()}`;
      foot.innerHTML='';
      $$('#execBody [data-fb]').forEach(b=>b.onclick=()=>{ st.fb=b.dataset.fb; b.setAttribute('aria-pressed','true'); setTimeout(nextStage,250); });
    }
    return;
  }
  if(st.type==='done'){
    const s=R.saved; const sets=s?s.items.reduce((a,i)=>a+i.sets.length,0):0; const reps=s?s.items.reduce((a,i)=>a+i.sets.reduce((x,y)=>x+y,0),0):0;
    const dur=Math.round((Date.now()-R.startedAt)/60);
    const DONE_TXT={stretch:['🧘','ストレッチ完了','体をゆるめました。今日はよく寝よう。'],snack:['🍪','スナック完了！','1〜2分でも積み重なる。休みの日の「ちょい足し」は回復のじゃまをしない。'],cardio:['🔥','サーキット完了！','10分でも心拍が上がれば効いている。水を飲んで、たんぱく質をとろう。'],train:['🎉','おつかれさま！','今日の分は終わり。あとは食べて寝れば筋肉が育ちます。']}[R.kind]||['🎉','完了','おつかれさま'];
    body.innerHTML=`<div class="summ"><div class="big pop">${DONE_TXT[0]}</div><h2>${DONE_TXT[1]}</h2><p class="muted">${DONE_TXT[2]}</p></div>
      ${s?`<div class="stat3"><div><b>${Math.max(1,Math.round(s.dur/60))}</b><small>分</small></div><div><b>${sets}</b><small>セット</small></div><div><b>${reps}</b><small>合計${s.items.some(i=>EX_BY_ID[i.ex].kind==='time')?'回/秒':'回'}</small></div></div>`:''}
      ${s&&s.ups.length?s.ups.map(u=>`<div class="levelup pop">🆙 ${PATTERNS[u.pat].name}がレベルアップ！ → ${esc(u.to)}<small>${esc(u.msg)}</small></div>`).join(''):''}
      ${s&&s.downs.length?s.downs.map(u=>`<div class="levelup" style="border-color:var(--warn)">🔧 ${PATTERNS[u.pat].name}を一段やさしく → ${esc(u.to)}<small>「きつすぎ」が2回続いたので、フォームを固め直す作戦です</small></div>`).join(''):''}
      ${R.newBadges&&R.newBadges.length?R.newBadges.map(b=>`<div class="levelup pop" style="border-color:var(--warn)">${b.emoji} 実績「${esc(b.name)}」を獲得！<small>${esc(b.desc)}</small></div>`).join(''):''}
      ${s?`<table style="width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px">${s.items.map(i=>`<tr><td style="padding:5px 0;border-top:1px solid var(--line)">${esc(EX_BY_ID[i.ex].name)}</td><td style="padding:5px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap">${i.sets.join(' / ')}${unit(EX_BY_ID[i.ex])} ${({easy:'😎',ok:'🙂',hard:'🥵'})[i.fb]||''}</td></tr>`).join('')}</table>
      <label class="f">ひとことメモ（任意）</label><input type="text" id="noteIn" placeholder="例: 腕立てでひじが痛かった、今日は調子よかった" maxlength="80">`:''}`;
    foot.innerHTML=`${R.kind==='train'&&s?`<button class="btn sub sm mb" id="shareBtn">📤 画像でシェア・保存</button>`:''}<button class="btn" id="finBtn">ホームにもどる</button>`;
    const shb=$('#shareBtn'); if(shb) shb.onclick=()=>shareCard('session');
    $('#finBtn').onclick=()=>{ if(s){ const n=$('#noteIn'); if(n&&n.value.trim()){ s.note=n.value.trim(); save(); } } endRun(); };
  }
}

/* ---------- セッションの保存とレベル判定 ---------- */
function finishSession(partial){
  if(R.saved) return R.saved;
  const today=dkey();
  if(R.kind==='stretch'){
    const sess={id:uid(),date:today,kind:'stretch',dur:Math.round((Date.now()-R.startedAt)/1000),items:[],ups:[],downs:[]};
    S.sessions.push(sess); save(); R.saved=sess; return sess;
  }
  if(R.kind==='cardio'){
    const sess={id:uid(),date:today,t:R.startedAt,kind:'cardio',dur:Math.round((Date.now()-R.startedAt)/1000),items:[],ups:[],downs:[]};
    S.sessions.push(sess); R.newBadges=checkBadges(); save(); R.saved=sess; return sess;
  }
  if(R.kind==='snack'){
    const items=R.stages.filter(s=>s.type==='ex'&&s.results.length).map(st=>({ex:st.ex.id,pat:st.pat,lv:st.ex.lv,sets:st.results,target:st.target,fb:st.fb||'ok'}));
    const sess={id:uid(),date:today,t:R.startedAt,kind:'snack',dur:Math.round((Date.now()-R.startedAt)/1000),items,ups:[],downs:[]};
    S.sessions.push(sess); R.newBadges=checkBadges(); save(); R.saved=sess; return sess;
  }
  const items=R.stages.filter(s=>s.type==='ex'&&s.results.length).map(st=>({ex:st.ex.id,pat:st.pat,lv:st.ex.lv,sets:st.results,target:st.target,fb:st.fb||'ok'}));
  const ups=[],downs=[];
  items.forEach(it=>{
    const ex=EX_BY_ID[it.ex]; const prev=S.last[ex.id]||{}; const min=Math.min(...it.sets); const pat=it.pat;
    const hardStreak=(it.fb==='hard'&&min<ex.range[0])?(prev.hardStreak||0)+1:0;
    S.last[ex.id]={date:today,reps:it.sets,fb:it.fb,hardStreak};
    const maxed=min>=ex.range[1]&&it.fb!=='hard'&&it.sets.length>=2;
    if(maxed&&ex.lv>=S.levels[pat]){
      const nx=nextAvail(pat,ex.lv);
      if(nx){ S.levels[pat]=nx.lv; ups.push({pat,from:ex.name,to:nx.name,msg:`${ex.name}で全セット${ex.range[1]}${unit(ex)}以上できたので、次回から${nx.name}`}); }
      else if(S.levels[pat]!==ex.lv){ S.levels[pat]=ex.lv; ups.push({pat,from:ex.name,to:ex.name,msg:'最高レベルに到達。ここからは回数と「きつくする」で伸ばそう'}); }
    }else if(ex.lv>S.levels[pat]&&it.fb!=='hard'&&min>=ex.range[0]){
      S.levels[pat]=ex.lv; ups.push({pat,from:'',to:ex.name,msg:'難しいほうをこなせたので、今日からこのレベル'});
    }else if(hardStreak>=2&&ex.lv===S.levels[pat]){
      const pv=prevAvail(pat,ex.lv); if(pv){ S.levels[pat]=pv.lv; S.last[ex.id].hardStreak=0; downs.push({pat,from:ex.name,to:pv.name}); }
    }
  });
  const sess={id:uid(),date:today,t:R.startedAt,kind:'train',tpl:R.menu.tpl,mode:R.menu.mode,mins:R.menu.mins,partial:!!partial,dur:Math.round((Date.now()-R.startedAt)/1000),items,ups,downs,note:''};
  S.sessions.push(sess); S.override={date:'',map:{},list:null}; R.newBadges=checkBadges(); save(); R.saved=sess; return sess;
}

    <div class="btnrow mt"><button class="btn sub sm" id="aiReview">🤖 AIコーチのひとこと</button><button class="btn sub sm" id="shareWeek">📤 今週を画像に</button></div><div id="aiOut">${(S.aiNotes||{})[ws]?`<div class="aiout">🤖 ${esc(S.aiNotes[ws])}</div>`:''}</div></div>`;
  const badges=`<div class="card tight"><h2>実績 <span class="sub">${Object.keys(S.badges).length}/${BADGES.length}</span></h2><div class="badges">${BADGES.map(b=>`<div class="bd ${S.badges[b.id]?'on':''}"><span>${b.emoji}</span><b>${esc(b.name)}</b><small>${S.badges[b.id]?fmtDate(S.badges[b.id]):esc(b.desc)}</small></div>`).join('')}</div></div>`;
  let testCard='';
  if(S.tests.length){ const ts=[...S.tests].sort((a,b)=>a.date<b.date?-1:1).slice(-12); const latest=ts[ts.length-1]; let chart='';
    if(ts.length>=2){ const vals=ts.map(t=>t.score); const mn=Math.min(...vals)-2,mx=Math.max(...vals)+2; const BW=320,BH=110,pl=30,pb=18; const X=i=>pl+i*(BW-pl-8)/(ts.length-1), Y=v=>BH-pb-(v-mn)/(mx-mn)*(BH-pb-8);
      chart=`<svg class="chart" viewBox="0 0 ${BW} ${BH}"><line class="axis" x1="${pl}" y1="${BH-pb}" x2="${BW-4}" y2="${BH-pb}"/><polyline class="ln" points="${ts.map((t,i)=>`${X(i)},${Y(t.score)}`).join(' ')}"/>${ts.map((t,i)=>`<circle class="pt" cx="${X(i)}" cy="${Y(t.score)}" r="3"/><text x="${X(i)}" y="${Y(t.score)-6}" text-anchor="middle">${t.score}</text>`).join('')}<text x="${X(0)}" y="${BH-4}">${fmtDate(ts[0].date)}</text><text x="${X(ts.length-1)}" y="${BH-4}" text-anchor="end">${fmtDate(latest.date)}</text></svg>`; }
    testCard=`<div class="card tight"><h2>筋力スコア <span class="sub">チェックテスト</span></h2>${chart}<div class="stat3 mt"><div><b>${latest.push}</b><small>${esc((EX_BY_ID[latest.pushEx]||{}).name||'腕立て')}</small></div><div><b>${latest.squat}</b><small>スクワット</small></div><div><b>${latest.plank}</b><small>プランク秒</small></div></div><div class="tiny mt">スコア ${latest.score}（腕立て×2＋スクワット＋プランク秒÷2）・${fmtDate(latest.date)}</div><button class="btn ghost sm mt" id="testBtn2" style="width:auto;padding:6px 12px">テストをする</button></div>`; }
  const totalSets=T.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.sets.length,0),0);
  // ヒートマップ 13週

  let heat='<div class="heat">';

    bodyChart=`<svg class="chart" viewBox="0 0 ${BW} ${BH}"><line class="axis" x1="${pl}" y1="${BH-pb}" x2="${BW-4}" y2="${BH-pb}"/><text x="2" y="${Y(mx-1)+4}">${(mx-1).toFixed(1)}</text><text x="2" y="${Y(mn+1)+4}">${(mn+1).toFixed(1)}</text>${goalKg!=null?`<line class="goal" x1="${pl}" y1="${Y(goalKg)}" x2="${BW-4}" y2="${Y(goalKg)}"/><text x="${BW-4}" y="${Y(goalKg)-3}" text-anchor="end">目標 ${goalKg}</text>`:''}<polyline class="ln" points="${pts}" style="opacity:${S.diet.on?.35:1};stroke-width:${S.diet.on?1.5:2.5}"/>${S.diet.on?`<polyline class="ln" points="${maPts}"/>`:''}${body.map((b,i)=>`<circle class="pt" cx="${X(i)}" cy="${Y(b.kg)}" r="${S.diet.on?2:3}"/>`).join('')}<text x="${X(0)}" y="${BH-4}">${fmtDate(body[0].date)}</text><text x="${X(body.length-1)}" y="${BH-4}" text-anchor="end">${fmtDate(body[body.length-1].date)}</text></svg>${S.diet.on?'<div class="tiny">太い線＝7日平均（これで判断する）／うすい線＝毎日の値／点線＝目標</div>':''}`;
