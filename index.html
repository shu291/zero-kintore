    <div class="card tight"><h2>履歴</h2>${hist.length?`<ul class="hist">${hist.map(s=>`<li data-id="${s.id}"><div class="hd"><b>${fmtDate(s.date)}</b>${s.kind==='stretch'?'<span class="pill info">ストレッチ</span>':s.kind==='snack'?'<span class="pill">🍪 スナック</span>':s.kind==='cardio'?'<span class="pill warn">🔥 サーキット</span>':s.kind==='walk'?`<span class="pill warn">🚶 歩き ${Math.round(s.dur/60)}分${s.steps?' ・ '+s.steps.toLocaleString()+'歩':''}</span>`:`<span class="pill acc">${TEMPLATES[s.tpl]?.emoji||''} ${TEMPLATES[s.tpl]?.name||''}</span>`}${s.partial?'<span class="pill warn">途中</span>':''}${s.mode==='light'?'<span class="pill">軽め</span>':s.mode==='comeback'?'<span class="pill">久しぶり</span>':''}<span class="r">${fmtDur(s.dur)}${s.kind==='train'?' ・ '+s.items.reduce((a,i)=>a+i.sets.length,0)+'セット':''}</span></div>
      <div class="dt">${s.kind==='train'?`<table>${s.items.map(i=>`<tr><td>${esc(EX_BY_ID[i.ex]?.name||i.ex)} <span class="tiny">Lv.${i.lv}</span></td><td>${i.sets.join(' / ')}${unit(EX_BY_ID[i.ex]||{kind:'reps'})} ${({easy:'😎',ok:'🙂',hard:'🥵'})[i.fb]||''}</td></tr>`).join('')}</table>`:''}
      ${s.ups?.length?`<div class="tiny mt">🆙 ${s.ups.map(u=>esc(u.to)).join('、')}</div>`:''}${s.note?`<div class="tiny mt">📝 ${esc(s.note)}</div>`:''}
      <button class="btn ghost sm mt del" data-id="${s.id}" style="width:auto;padding:6px 12px">この記録を削除</button></div></li>`).join('')}</ul>`:'<p class="tiny">まだ記録がありません。最初の1回をやってみよう。</p>'}</div>`;
  $$('#v-log .lv').forEach(b=>b.onclick=()=>openLadder(b.dataset.pat));
  const tb2=$('#testBtn2'); if(tb2) tb2.onclick=openTest;
  $$('#v-log .food').forEach(b=>b.onclick=()=>{ const f=FOODS[+b.dataset.i]; S.protein=S.protein||{}; (S.protein[today]=S.protein[today]||[]).push({n:f.n,g:f.g,k:f.k}); const keys=Object.keys(S.protein).sort(); while(keys.length>40){ delete S.protein[keys.shift()]; } save(); renderLog(); });
  $$('#v-log .pdel').forEach(b=>b.onclick=()=>{ S.protein[today].splice(+b.dataset.i,1); save(); renderLog(); });
  $('#aiReview').onclick=()=>runAI($('#aiReview'),$('#aiOut'),aiContext()+' この1週間のふりかえりと、来週に向けたアドバイスを、ほめる→改善点1つ→ひとことの順で。',ws);
  $('#shareWeek').onclick=()=>shareCard('week');

const LIB={sub:'ex',pat:'all'};
function renderLib(){
  const sub=`<div class="subtabs"><button data-sub="ex" aria-pressed="${LIB.sub==='ex'}">種目図鑑</button><button data-sub="know" aria-pressed="${LIB.sub==='know'}">基礎知識</button></div>`;
  let html='';
  if(LIB.sub==='ex'){
    const filt=`<div class="patfilter"><button data-pat="all" aria-pressed="${LIB.pat==='all'}">すべて</button>${PAT_ORDER.map(p=>`<button data-pat="${p}" aria-pressed="${LIB.pat===p}" style="--pc:${PATTERNS[p].color}">${PATTERNS[p].emoji} ${PATTERNS[p].name}</button>`).join('')}</div>`;
    const pats=LIB.pat==='all'?PAT_ORDER:[LIB.pat];
    html=filt+pats.map(pat=>`<div class="card tight"><h2>${PATTERNS[pat].emoji} ${PATTERNS[pat].name} <span class="sub">${PATTERNS[pat].sub} ・ いま Lv.${S.levels[pat]}</span></h2>
      <div class="ladder">${ladder(pat).map(e=>{ const na=!hasEquip(e.need); const cur=e.lv===S.levels[pat];
        return `<div class="st ${cur?'cur':e.lv<S.levels[pat]?'done':''} ${na?'na':''}" data-ex="${e.id}" style="--pc:${PATTERNS[pat].color}"><div class="num">${e.lv}</div><div class="fig" style="width:52px;height:34px;flex:none">${figSVG(e.fig,{static:true})}</div><div><div class="nm">${esc(e.name)}</div><div class="meta">${e.range[0]}〜${e.range[1]}${unit(e)}${e.sides?' ・左右':''}${e.need?' ・要 '+esc(needName(e)):''}</div></div>${cur?`<div class="rt">${pickEx(pat).id===e.id?'いまここ':'同じ段'}</div>`:''}</div>`; }).join('')}</div></div>`).join('');
  }else{
    html=`<div class="card tight">${KNOWLEDGE.map(k=>`<details class="acc"><summary>${k.emoji} ${esc(k.title)}</summary><div class="bd">${k.body}</div></details>`).join('')}</div>
      <div class="card tight"><h2>このアプリの仕組み</h2><div class="tiny">
      ・種目は7つの動作パターン（押す／肩／引く／しゃがむ／片足／お尻／体幹）ごとに「はしご」になっています。回数の上限まで届くと次の段へ。<br>
      ・今日の目標回数は「前回の最小回数＋1」。きつすぎなら据え置き、楽すぎなら＋2。<br>
      ・昨日やったなら今日は休み。3日連続はやらない。7日以上あいたら7割で再開。<br>
      ・A「押す＋しゃがむ」→ B「引く＋片足」→ C「全身」の順番に回ります。曜日は決めません。<br>
      ・道具（椅子／タオル＋ドア／テーブル／鉄棒／ダンベル／チューブ／リュック）の有無で種目を自動で飛ばし、同じ段に道具あり版があればそちらを優先します（設定で切替）。<br>
      ・「メニューを決める」で Lv.○ にまとめて／パターンごとに種目を選べます（今日だけ／次回以降も固定）。<br>
      ・4週で1サイクル（導入→積み上げ→強化→回復週）。開始前のコンディションが低い日は自動で軽め。痛みを登録した部位は期間中メニューから外れます。<br>
      ・3回続けて回数が伸びない種目は「停滞」として対策を提案。4週に1回のチェックテストで筋力スコアを記録します。<br>
      ・休みの日は「スナック筋トレ」（1種目1セット）。休憩中はクイズ。じぶん人形はレベルに応じて太くなります。<br>
      ・音声ガイド・鏡モード（カメラ）・テンポ音はすべて端末内で動きます。AIコーチだけは任意で Gemini（無料枠）を使います。<br>
      ・ダイエット：体重は7日平均で判断、目標はBMI18.5以上・週0.5kg以内、食事の目安は基礎代謝を下回らない。成長期は減らし方をさらに控えめに。<br>
      ・データはこの端末の中だけに保存されます（サーバーには送りません）。設定から書き出しできます。</div></div>`;
  }
  $('#v-lib').innerHTML=sub+html;
  $$('#v-lib [data-sub]').forEach(b=>b.onclick=()=>{LIB.sub=b.dataset.sub;renderLib();});
  $$('#v-lib [data-pat]').forEach(b=>b.onclick=()=>{LIB.pat=b.dataset.pat;renderLib();});
  $$('#v-lib .st').forEach(el=>el.onclick=()=>openExDetail(el.dataset.ex));
}

  $('#tmIn').onchange=e=>{S.settings.tempo=e.target.checked;save();};
  $('#vcIn').onchange=e=>{S.settings.voice=e.target.checked;save(); if(e.target.checked){ audioInit(); speak('音声ガイドをオンにしました'); }};
  $('#mrIn').onchange=e=>{S.settings.mirror=e.target.checked;save();};
  $$('#v-set .daysel button').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d; const arr=S.settings.remDays||[]; S.settings.remDays=arr.includes(d)?arr.filter(x=>x!==d):[...arr,d].sort(); save(); renderSet(); });
  $('#remTime').onchange=e=>{S.settings.remTime=e.target.value||'19:00';save();};
  $('#icsBtn').onclick=makeICS;
  $('#dietOn').onchange=e=>{ if(e.target.checked&&!S.diet.height){ e.target.checked=false; openDietSetup(); } else { S.diet.on=e.target.checked; save(); renderSet(); } };
  $('#dietKcal').onchange=e=>{S.diet.showKcal=e.target.checked;save();};
  $('#dietSetup').onclick=openDietSetup;
  $('#gkIn').onchange=e=>{S.settings.geminiKey=e.target.value.trim();save();toast(S.settings.geminiKey?'APIキーを保存しました（この端末だけ）':'APIキーを消しました');};
  $('#gkTest').onclick=async()=>{ const o=$('#gkOut'); await runAI($('#gkTest'),o,'自己紹介を1文で。'); };
  $('#dlOn').onclick=()=>{ const ws=weekStart(dkey()); if(!S.program.deload.includes(ws)) S.program.deload.push(ws); S.program.skipDeload=S.program.skipDeload.filter(w=>w!==ws); save(); H.tpl=null; renderSet(); toast('今週を回復週にしました'); };
  $('#dlOff').onclick=()=>{ const ws=weekStart(dkey()); S.program.deload=S.program.deload.filter(w=>w!==ws); if(!S.program.skipDeload.includes(ws)) S.program.skipDeload.push(ws); save(); H.tpl=null; renderSet(); toast('今週は通常の週にしました'); };
  $('#painBtn').onclick=openPain; $('#testBtn3').onclick=openTest;
  $('#vibIn').onchange=e=>{S.settings.vib=e.target.checked;save();};
  $$('#v-set .lvm').forEach(b=>b.onclick=()=>{const p=b.dataset.pat; const pv=prevAvail(p,S.levels[p]); if(pv){S.levels[p]=pv.lv;save();renderSet();} else toast('これ以上下げられません');});
  $$('#v-set .lvp').forEach(b=>b.onclick=()=>{const p=b.dataset.pat; const nx=nextAvail(p,S.levels[p]); if(nx){S.levels[p]=nx.lv;save();renderSet();} else { const up=ladder(p).find(e=>e.lv>S.levels[p]); toast(up?`上の段は「${needName(up)}」が必要です（道具にチェック）`:'最高レベルです'); }});
  $('#expBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`zero-kintore-${dkey()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('書き出しました'); };
  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.levels||!d.sessions) throw 0; S=deepMerge(DEFAULT_STATE(),d); save(); applyTheme(); renderSet(); toast('読み込みました'); }catch(err){ toast('ファイルが読めませんでした'); } }; rd.readAsText(f); e.target.value=''; };
  $('#resetBtn').onclick=()=>confirmBox('すべて初期化','記録・レベル・設定がすべて消えます。元に戻せません。','初期化する',()=>{ localStorage.removeItem(KEY); S=DEFAULT_STATE(); save(); applyTheme(); startOnboarding(); },true);
  $('#onbBtn').onclick=()=>startOnboarding();
}

/* =====================================================================
   初回セットアップ
   ===================================================================== */
const OB={step:0,goal:'fit',name:'',equip:null,pushq:null,squatq:null,plankq:null,days:3,time:20};
function startOnboarding(){ OB.step=0; OB.equip={...S.equip}; OB.goal=S.profile.goal; OB.name=S.profile.name; OB.days=S.profile.days; OB.time=S.profile.time; $('#onb').classList.add('on'); document.body.style.overflow='hidden'; renderOnb(); }
function renderOnb(){
  const body=$('#onbBody'), foot=$('#onbFoot'); const steps=`<div class="steps">${[0,1,2,3,4].map(i=>`<i class="${i<=OB.step?'on':''}"></i>`).join('')}</div>`;
  const ch=(name,vals,cur,col)=>`<div class="choice ${col?'col':''}" data-c="${name}">${vals.map(([v,l,d])=>`<button data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}${d?`<small>${d}</small>`:''}</button>`).join('')}</div>`;
  if(OB.step===0){
    body.innerHTML=`<div class="welcome">💪</div><h1 class="center">ゼロから筋トレ</h1><p class="muted center">道具なし・1回20分・週3回。<br>「今日なにをやるか」をぜんぶ決めてくれる、初心者のためのアプリ。</p>
      <div class="card tight mt">
        <div class="feature"><div class="ic">📋</div><div><b>今日のメニューが自動で決まる</b><small>前回いつ何をやったかを見て、今日やる種目・セット・回数を決めます</small></div></div>
        <div class="feature"><div class="ic">🪜</div><div><b>できるようになったら次の段へ</b><small>壁腕立て → ひざつき → ふつうの腕立て…と、7つのパターンごとにレベルアップ</small></div></div>
        <div class="feature"><div class="ic">⏱️</div><div><b>タイマーと棒人間つき</b><small>休憩・秒数キープを自動カウント。動きは画面のアニメで確認</small></div></div>
        <div class="feature"><div class="ic">🛌</div><div><b>休む日も教えてくれる</b><small>昨日やったなら今日は休み。がんばりすぎを止めるのも仕事</small></div></div>
      </div>`;
    foot.innerHTML=`<button class="btn" id="obNext">はじめる（1分で終わります）</button>`;
  }else if(OB.step===1){
    body.innerHTML=`${steps}<h1>目標はなに？</h1><p class="muted">メニューの組み方は同じですが、声かけとおすすめの回数が少し変わります。</p>
      ${ch('goal',Object.entries(GOALS).map(([k,g])=>[k,g.emoji+' '+g.name]),OB.goal,true)}
      <label class="f">ニックネーム（任意）</label><input type="text" id="obName" value="${esc(OB.name)}" placeholder="例: しゅう" maxlength="12">`;
    foot.innerHTML=`<div class="btnrow"><button class="btn sub" id="obBack">もどる</button><button class="btn" id="obNext">つぎへ</button></div>`;
  }else if(OB.step===2){
    body.innerHTML=`${steps}<h1>使える道具は？</h1><p class="muted">なくても全パターンできます。あるものにチェックすると種目が増えます。</p>
      ${Object.entries(EQUIP).map(([k,e])=>`<label class="check"><input type="checkbox" data-eq="${k}" ${OB.equip[k]?'checked':''}><div>${e.emoji} ${esc(e.name)} <span class="pill" style="font-size:11px">＋${EX.filter(x=>needs(x).includes(k)).length}種目</span><small>${esc(e.desc)}</small></div></label>`).join('')}`;
    foot.innerHTML=`<div class="btnrow"><button class="btn sub" id="obBack">もどる</button><button class="btn" id="obNext">つぎへ</button></div>`;
  }else if(OB.step===3){
    body.innerHTML=`${steps}<h1>いまの体力は？</h1><p class="muted">だいたいでOK。ここで最初のレベルを決めます（やってみて合わなければ自動で調整されます）。</p>
      <label class="f">ふつうの腕立て伏せ、何回できる？</label>${ch('pushq',[[0,'0回'],[1,'1〜4回'],[2,'5〜15回'],[3,'16回以上']],OB.pushq)}
      <label class="f">スクワット、続けて何回できる？</label>${ch('squatq',[[0,'10回未満'],[1,'10〜19回'],[2,'20回以上']],OB.squatq)}
      <label class="f">プランク（うつぶせで体を一直線にキープ）、何秒？</label>${ch('plankq',[[0,'やったことない'],[1,'20秒未満'],[2,'20〜45秒'],[3,'46秒以上']],OB.plankq)}`;
    foot.innerHTML=`<div class="btnrow"><button class="btn sub" id="obBack">もどる</button><button class="btn" id="obNext">つぎへ</button></div>`;
  }else{
    body.innerHTML=`${steps}<h1>どのくらいやる？</h1><p class="muted">初心者は週2〜3回・1回20分がいちばん効率がいい、というのが研究の結論です。</p>
      <label class="f">週に何回？</label>${ch('days',[[2,'2回','忙しい人向け'],[3,'3回','おすすめ'],[4,'4回','慣れてきたら']],OB.days)}
      <label class="f">1回の時間</label>${ch('time',[[10,'10分','短くても効く'],[20,'20分','標準'],[30,'30分','しっかり']],OB.time)}
      <div class="tipbox mt">曜日は決めません。「昨日やったか」「今週何回やったか」を見て、アプリが今日やるか休むかを決めます。</div>`;
    foot.innerHTML=`<div class="btnrow"><button class="btn sub" id="obBack">もどる</button><button class="btn ok" id="obFin">これで始める</button></div>`;
  }
  $$('#onbBody .choice').forEach(c=>c.querySelectorAll('button').forEach(b=>b.onclick=()=>{ let v=b.dataset.v; if(!isNaN(v)) v=+v; OB[c.dataset.c]=v; renderOnb(); }));
  $$('#onbBody [data-eq]').forEach(i=>i.onchange=()=>{OB.equip[i.dataset.eq]=i.checked;});
  const nm=$('#obName'); if(nm) nm.oninput=e=>{OB.name=e.target.value;};
  const nx=$('#obNext'); if(nx) nx.onclick=()=>{ if(OB.step===3&&(OB.pushq===null||OB.squatq===null||OB.plankq===null)){toast('3つとも選んでください');return;} OB.step++; renderOnb(); $('#onbBody').scrollTop=0; };
  const bk=$('#obBack'); if(bk) bk.onclick=()=>{OB.step--;renderOnb();};
  const fin=$('#obFin'); if(fin) fin.onclick=finishOnboarding;
}
function finishOnboarding(){
  S.profile.goal=OB.goal; S.profile.name=OB.name.trim(); S.profile.days=OB.days; S.profile.time=OB.time; S.equip={...OB.equip};
  if(!S.profile.onboarded){
    const L=S.levels; const pq=OB.pushq??0, sq=OB.squatq??0, kq=OB.plankq??0;
    L.push=[S.equip.chair?2:1,3,4,S.equip.chair?5:4][pq];
    L.vpush=pq>=2?2:1;
    L.pull=pq>=3?3:pq>=2?2:1;
    L.squat=[S.equip.chair?1:2,2,3][sq];
    L.lunge=sq>=2?2:1;
    L.hinge=sq>=2?2:1;
    L.core=[1,2,3,4][kq];
    S.profile.created=dkey();
  }
  S.profile.onboarded=true; save();
  $('#onb').classList.remove('on'); document.body.style.overflow='';
  H.tpl=null; TAB='home'; $$('nav.tabs button').forEach((x,i)=>x.setAttribute('aria-current',i===0)); $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-home'));
  render(); toast('準備完了！今日のメニューを見てみよう');
  if(S.profile.goal==='diet'&&!S.diet.on) setTimeout(openDietSetup,600);
}

/* ---------- 起動 ---------- */
applyTheme();
if(!S.profile.onboarded) startOnboarding();
render();
if('serviceWorker' in navigator && location.protocol!=='file:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
</body>
